# 테스트는 인메모리 H2로 돈다 — Postgres 컨테이너가 없어도 빌드가 통과해야 한다.
spring.datasource.url=jdbc:h2:mem:coach2;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트에서는 context-path를 비운다. 경로 prefix는 배포 시 환경변수로만 주입되는 값이라
# 테스트가 그것에 묶이면 서브도메인으로 전환할 때 같이 깨진다.
server.servlet.context-path=

# 운영에서는 기본값이 없어 미주입 시 기동이 막힌다(의도된 동작). 테스트에서만 값을 준다.
admin.secret=test-admin-secret
