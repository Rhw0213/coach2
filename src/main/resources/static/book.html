<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1:1 면접·상담 예약 · 온라인 채용박람회</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<p class="mark">온라인 채용박람회</p>
		<nav>
			<a href="index.html">행사 안내</a>
			<a href="book.html" aria-current="page">예약하기</a>
			<a href="my.html">내 예약</a>
		</nav>
	</header>

	<p class="eyebrow" id="eventDate">1:1 면접·상담</p>
	<h1>예약 시간을 지정해 주세요</h1>
	<p class="lede">기업마다 상담 시간이 정해져 있습니다. 한 시간대에 한 명씩만 배정되니 원하는 시간을 먼저 확보하세요. 회원가입은 없습니다.</p>

	<div id="ticket"></div>

	<h2>참가 기업</h2>
	<div id="booths"><p class="empty">불러오는 중…</p></div>

	<section id="day" hidden>
		<h2 id="dayTitle"></h2>
		<div id="rail"><p class="empty">불러오는 중…</p></div>
	</section>

</div>

<dialog id="sheet">
	<form method="dialog" id="bookForm">
		<h2>상담 예약</h2>
		<p class="when" id="sheetWhen"></p>

		<label>
			<span>이름</span>
			<input name="name" required autocomplete="name" maxlength="40">
		</label>
		<label>
			<span>연락처</span>
			<input name="phone" required type="tel" inputmode="tel" autocomplete="tel"
			       placeholder="010-1234-5678" maxlength="20">
		</label>

		<div id="sheetError"></div>

		<div class="actions">
			<button class="btn btn--ghost" type="button" id="sheetClose">닫기</button>
			<button class="btn" type="submit" id="sheetSubmit">예약 확정</button>
		</div>
	</form>
</dialog>

<script src="app.js"></script>
<script>
const el = {
	eventDate: document.getElementById('eventDate'),
	booths: document.getElementById('booths'),
	day: document.getElementById('day'),
	dayTitle: document.getElementById('dayTitle'),
	rail: document.getElementById('rail'),
	ticket: document.getElementById('ticket'),
	sheet: document.getElementById('sheet'),
	sheetWhen: document.getElementById('sheetWhen'),
	sheetError: document.getElementById('sheetError'),
	sheetSubmit: document.getElementById('sheetSubmit'),
	form: document.getElementById('bookForm'),
};

let booths = [];
let booth = null;
let picked = null;
/* 한 사람은 한 부스를 한 번만 잡을 수 있다. 이미 잡은 부스를 눌러보고 나서
 * 실패하게 두지 않으려면 화면이 먼저 알려줘야 한다. */
let bookedBoothIds = new Set();

init();

async function init() {
	try {
		booths = await api('api/booths');
	} catch (e) {
		showError(el.booths, e.message);
		return;
	}
	await loadMine();
	if (!booths.length) {
		el.booths.innerHTML = '<p class="empty">아직 등록된 부스가 없습니다.</p>';
		return;
	}
	// 하루짜리 행사다. 부스들이 같은 날이면 날짜를 한 번만 크게 말해준다.
	const dates = [...new Set(booths.map(b => b.eventDate))];
	el.eventDate.textContent = dates.length === 1
		? dayLabel(dates[0]) + ' · 1:1 상담'
		: '1:1 상담';

	renderBooths();
	select(booths[0]);
}

/** 확인 번호가 있으면 이미 잡은 부스를 미리 파악한다. 실패해도 예약을 막지 않는다 —
 *  최종 판정은 어차피 서버가 한다. */
async function loadMine() {
	if (!store.token) {
		return;
	}
	try {
		const list = await api('api/reservations/me/' + encodeURIComponent(store.token));
		bookedBoothIds = new Set(
			list.filter(r => r.status === 'RESERVED').map(r => r.boothId));
	} catch {
		bookedBoothIds = new Set();
	}
}

function renderBooths() {
	const list = document.createElement('ul');
	list.className = 'booth-grid';
	// list-style:none 을 주면 Safari/VoiceOver가 목록 의미를 버린다. 명시로 되돌린다.
	list.setAttribute('role', 'list');
	for (const b of booths) {
		const li = document.createElement('li');
		const btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'booth-card';
		btn.dataset.id = b.id;
		btn.setAttribute('aria-pressed', 'false');

		// 부스번호를 먼저 읽는다 — 같은 기업이 여러 세션을 열 때 구분하는 표식이다.
		const no = document.createElement('div');
		no.className = 'booth-meta';
		no.style.margin = '0 0 .25rem';
		no.textContent = b.boothNo;
		btn.append(no);

		const name = document.createElement('div');
		name.className = 'booth-company';
		name.textContent = b.companyName;
		btn.append(name);

		if (b.note) {
			const t = document.createElement('div');
			t.className = 'booth-note';
			t.textContent = b.note;
			btn.append(t);
		}

		const hours = document.createElement('div');
		hours.className = 'booth-meta';
		hours.textContent = bookedBoothIds.has(b.id)
			? '예약함'
			: `${b.openFrom.slice(0, 5)}–${b.openTo.slice(0, 5)} · ${b.slotMinutes}분`;
		if (bookedBoothIds.has(b.id)) {
			hours.classList.add('booth-meta--booked');
		}
		btn.append(hours);

		btn.addEventListener('click', () => select(b));
		li.append(btn);
		list.append(li);
	}
	el.booths.replaceChildren(list);
}

function select(b) {
	booth = b;
	for (const btn of el.booths.querySelectorAll('.booth-card')) {
		btn.setAttribute('aria-pressed', String(Number(btn.dataset.id) === b.id));
	}
	el.day.hidden = false;
	el.dayTitle.textContent = `${b.boothNo} ${b.companyName} · ${dayLabel(b.eventDate)}`;

	if (bookedBoothIds.has(b.id)) {
		// 잡을 수 없는 시간을 초록으로 보여주면 눌러보고 실패한다. 아예 그리지 않는다.
		el.rail.innerHTML = '';
		const p = document.createElement('p');
		p.className = 'empty';
		p.textContent = '이 부스는 이미 예약하셨습니다. 한 부스당 한 번만 예약할 수 있습니다.';
		const go = document.createElement('a');
		go.className = 'btn';
		go.style.cssText = 'display:inline-block;text-decoration:none;flex:none;padding:.625rem 1rem';
		go.href = 'my.html';
		go.textContent = '내 예약에서 확인·변경';
		el.rail.append(p, go);
		return;
	}
	loadSlots();
}

async function loadSlots() {
	el.rail.innerHTML = '<p class="empty">불러오는 중…</p>';
	let open;
	try {
		open = await api(`api/booths/${booth.id}/slots`);
	} catch (e) {
		showError(el.rail, e.message);
		return;
	}
	renderRail(new Set(open.map(s => new Date(s).getTime())));
}

/* 레일: 운영시간 전체를 밴드로 깔고, 예약 가능한 시간만 채운다.
 * 마감·지난 시간을 빈 칸으로 남겨야 얼마나 차 있는지가 눈에 보인다. */
function renderRail(openSet) {
	const grid = slotGrid(booth.eventDate, booth.openFrom, booth.openTo, booth.slotMinutes);
	if (!grid.length) {
		el.rail.innerHTML = '<p class="empty">운영 시간이 설정되지 않았습니다.</p>';
		return;
	}

	const now = Date.now();
	const list = document.createElement('ol');
	list.className = 'rail';
	list.setAttribute('role', 'list');
	list.setAttribute('aria-label', '예약 가능한 시간');
	let lastHour = null;

	for (const start of grid) {
		const iso = start.toISOString();
		const isOpen = openSet.has(start.getTime());
		const li = document.createElement('li');

		// 30분 슬롯이면 시각 눈금은 정시에만 찍는다 — 눈금이 촘촘하면 자가 아니라 노이즈가 된다.
		const hh = hhmm(iso).slice(0, 2);
		const hour = document.createElement('span');
		hour.className = 'hour';
		hour.textContent = hh === lastHour ? '' : hh;
		lastHour = hh;

		if (isOpen) {
			li.className = 'band';
			const btn = document.createElement('button');
			btn.type = 'button';
			btn.className = 'slot';
			btn.innerHTML = '<span class="t"></span><span class="dur"></span>';
			btn.querySelector('.t').textContent = hhmm(iso);
			btn.querySelector('.dur').textContent = booth.slotMinutes + '분';
			btn.addEventListener('click', () => openSheet(iso));
			li.append(hour, btn);
		} else {
			li.className = 'band band--gone';
			const gone = document.createElement('span');
			gone.className = 'gone';
			const t = document.createElement('span');
			t.className = 't';
			t.textContent = hhmm(iso);
			const why = document.createElement('span');
			why.textContent = start.getTime() < now ? '지난 시간' : '마감';
			gone.append(t, why);
			li.append(hour, gone);
		}
		list.append(li);
	}

	el.rail.replaceChildren(list);
	if (!grid.some(s => openSet.has(s.getTime()))) {
		const p = document.createElement('p');
		p.className = 'empty';
		p.textContent = '이 부스는 남은 시간이 없습니다. 다른 부스를 확인해 보세요.';
		el.rail.append(p);
	}
}

function openSheet(iso) {
	picked = iso;
	el.sheetWhen.textContent = `${booth.boothNo} ${booth.companyName} · ${fullWhen(iso)}`;
	el.sheetError.innerHTML = '';
	el.form.reset();
	el.sheet.showModal();
}

document.getElementById('sheetClose').addEventListener('click', () => el.sheet.close());

el.form.addEventListener('submit', async (event) => {
	event.preventDefault();
	const data = new FormData(el.form);
	el.sheetSubmit.disabled = true;
	el.sheetSubmit.textContent = '예약 중…';
	el.sheetError.innerHTML = '';

	try {
		const result = await api('api/reservations', {
			method: 'POST',
			body: JSON.stringify({
				boothId: booth.id,
				startTime: picked,
				name: data.get('name'),
				phone: data.get('phone'),
			}),
		});
		store.token = result.token;
		bookedBoothIds.add(booth.id);
		el.sheet.close();
		renderTicket(result);
		renderBooths();
		select(booth);
	} catch (e) {
		showError(el.sheetError, e.message);
		// 남이 먼저 잡은 슬롯이면 레일을 다시 그려야 한다. 안 그리면 방금 마감된 자리가
		// 계속 초록으로 남아 있어 사용자가 같은 곳을 또 눌러 같은 실패를 반복한다.
		// 통신이 끊겨 성공 여부가 불확실한 경우에도 여기서 실제 상태가 드러난다.
		loadSlots();
	} finally {
		el.sheetSubmit.disabled = false;
		el.sheetSubmit.textContent = '예약 확정';
	}
});

/* 확인 번호를 잃으면 예약을 다시 열 수 없다. 예약한 기업·시간과 함께 표처럼 넘긴다. */
function renderTicket(result) {
	const box = document.createElement('div');
	box.className = 'ticket';

	const h = document.createElement('p');
	h.className = 'eyebrow';
	h.textContent = '예약 완료';

	const where = document.createElement('p');
	where.style.cssText = 'font-weight:700;font-size:1.125rem;margin:0 0 .25rem';
	where.textContent = `${result.boothNo} ${result.companyName}`;

	const when = document.createElement('p');
	when.style.cssText = 'margin:0 0 .75rem;font-family:var(--mono);font-size:.875rem';
	when.textContent = `${fullWhen(result.startTime)} · ${result.slotMinutes}분`;

	const note = document.createElement('p');
	note.style.cssText = 'margin:0;font-size:.875rem';
	// 온라인 행사다. 어디로 오라고 하지 않는다 — 참여자가 할 일은 링크를 기다리는 것뿐이다.
	note.textContent = '예약한 시간에 ZOOM으로 참여합니다. 접속 링크는 행사 전날 신청하신 연락처로 보내드립니다. '
		+ '아래 확인 번호로 예약을 조회하고 취소할 수 있습니다.';

	const code = document.createElement('code');
	code.textContent = result.token;

	const actions = document.createElement('div');
	actions.className = 'actions';

	const copy = document.createElement('button');
	copy.type = 'button';
	copy.className = 'btn btn--ghost';
	copy.textContent = '번호 복사';
	copy.addEventListener('click', async () => {
		try {
			await navigator.clipboard.writeText(result.token);
			copy.textContent = '복사됨';
			setTimeout(() => { copy.textContent = '번호 복사'; }, 1500);
		} catch {
			copy.textContent = '직접 선택해 복사하세요';
		}
	});

	const go = document.createElement('a');
	go.className = 'btn';
	go.style.cssText = 'text-align:center;text-decoration:none';
	go.href = 'my.html';
	go.textContent = '내 예약 보기';

	actions.append(copy, go);
	box.append(h, where, when, note, code, actions);
	el.ticket.replaceChildren(box);
	box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
