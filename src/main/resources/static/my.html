<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 예약</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<p class="mark">취업박람회 부스 예약</p>
		<nav>
			<a href="index.html">행사 안내</a>
			<a href="company.html">참여기업</a>
			<a href="book.html">예약하기</a>
			<a href="my.html" aria-current="page">내 예약</a>
		</nav>
	</header>

	<p class="eyebrow">확인 · 취소</p>
	<h1>내 예약</h1>
	<p class="lede">예약할 때 적은 이름과 연락처를 넣으면 잡아둔 부스와 시간을 보고 취소할 수 있습니다.</p>

	<form id="lookup">
		<label>
			<span>이름</span>
			<input name="name" required autocomplete="name" maxlength="40">
		</label>
		<label>
			<span>연락처</span>
			<input name="phone" required type="tel" inputmode="tel" autocomplete="tel"
			       placeholder="010-1234-5678" maxlength="20">
		</label>
		<div class="actions">
			<button class="btn" type="submit">예약 조회</button>
		</div>
	</form>

	<div id="out"></div>

</div>

<script src="app.js"></script>
<script>
const form = document.getElementById('lookup');
const out = document.getElementById('out');

/* 같은 브라우저로 돌아온 사람에게는 이름·연락처를 다시 묻지 않는다. ?t= 링크도 그대로 받는다.
 * 어디까지나 지름길이다 — 실패하면 조용히 넘기고 아래 조회 폼으로 들어오게 둔다. */
const initial = new URLSearchParams(location.search).get('t') || store.token;
if (initial) {
	load(initial, true);
}

form.addEventListener('submit', async (event) => {
	event.preventDefault();
	const data = new FormData(form);
	out.innerHTML = '<p class="empty">불러오는 중…</p>';

	let result;
	try {
		result = await api('api/reservations/lookup', {
			method: 'POST',
			body: JSON.stringify({ name: data.get('name'), phone: data.get('phone') }),
		});
	} catch (e) {
		showError(out, e.message);
		return;
	}
	store.token = result.token;
	render(result.token, result.reservations);
});

async function load(token, quiet) {
	out.innerHTML = '<p class="empty">불러오는 중…</p>';
	let list;
	try {
		list = await api('api/reservations/me/' + encodeURIComponent(token));
	} catch (e) {
		// 저장된 값이 낡았을 뿐일 수 있다. 사용자가 아무것도 안 눌렀는데 뜨는 에러는 숨긴다.
		if (quiet) {
			out.replaceChildren();
		} else {
			showError(out, e.message);
		}
		return;
	}
	store.token = token;
	render(token, list);
}

function render(token, list) {
	out.replaceChildren();

	if (!list.length) {
		const p = document.createElement('p');
		p.className = 'empty';
		p.textContent = '이 번호로 된 예약이 없습니다.';
		out.append(p);
		return;
	}

	const heading = document.createElement('h2');
	heading.textContent = '예약 ' + list.length + '건';
	out.append(heading);

	const now = Date.now();
	for (const r of list) {
		const cancelled = r.status === 'CANCELLED';
		const past = new Date(r.startTime).getTime() < now;

		const stub = document.createElement('div');
		stub.className = 'stub' + (cancelled || past ? ' stub--off' : '');

		const time = document.createElement('div');
		time.className = 'stub-time';
		time.textContent = hhmm(r.startTime);

		const body = document.createElement('div');
		body.className = 'stub-body';

		const who = document.createElement('div');
		who.className = 'stub-who';
		who.textContent = r.boothNo + ' ' + r.companyName;

		const meta = document.createElement('div');
		meta.className = 'stub-meta';
		meta.textContent = fullWhen(r.startTime) + ' · ' + r.slotMinutes + '분'
			+ (cancelled ? ' · 취소됨' : past ? ' · 지난 예약' : '');

		body.append(who, meta);
		stub.append(time, body);

		// 취소는 되돌릴 수 없다. 지난 예약과 이미 취소된 예약에는 버튼을 두지 않는다.
		if (!cancelled && !past) {
			const actions = document.createElement('div');
			actions.className = 'stub-actions';
			const btn = document.createElement('button');
			btn.type = 'button';
			btn.className = 'btn btn--danger';
			btn.textContent = '예약 취소';
			// 실패 메시지는 이 예약 바로 아래에만 띄운다 — 목록 전체를 갈아치우면
			// 확인하러 온 다른 예약까지 사라진다.
			const slot = document.createElement('div');
			btn.addEventListener('click', () => cancel(token, r, btn, slot));
			actions.append(btn, slot);
			stub.append(actions);
		}

		out.append(stub);
	}
}

async function cancel(token, reservation, btn, errorSlot) {
	errorSlot.innerHTML = '';
	if (btn.dataset.confirming !== 'yes') {
		btn.dataset.confirming = 'yes';
		btn.textContent = '정말 취소할까요? 한 번 더 누르세요';
		setTimeout(() => {
			if (btn.dataset.confirming === 'yes') {
				btn.dataset.confirming = '';
				btn.textContent = '예약 취소';
			}
		}, 4000);
		return;
	}

	btn.disabled = true;
	btn.textContent = '취소 중…';
	try {
		await api(`api/reservations/${reservation.id}?token=${encodeURIComponent(token)}`,
			{ method: 'DELETE' });
		load(token);
	} catch (e) {
		showError(errorSlot, e.message);
		btn.disabled = false;
		btn.dataset.confirming = '';
		btn.textContent = '예약 취소';
	}
}
</script>
</body>
</html>
