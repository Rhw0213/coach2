<style>
/* 온라인 채용박람회 안내.
 *
 * 색은 배포된 포스터(채용박람회.png)를 그대로 쓴다. 같은 행사를 알리는 두 매체가
 * 다른 색이면 학생은 다른 행사로 읽는다. 다만 포스터의 '구조'까지 베끼지는 않았다 —
 * 인쇄물은 한 장을 훑게 만들면 되지만 이 페이지가 할 일은 하나, 예약이다.
 *
 * 그래서 히어로가 시간표다. 이 행사의 실체는 노트북 일러스트가 아니라 10:00~17:00을
 * 30분으로 자른 열네 칸이고, 참가자가 실제로 경쟁하는 대상이 그 칸이다. 종이가 못 하는
 * 단 하나가 그 칸의 지금 상태를 보여주는 것이라, 레일이 API에서 현황을 받아 칠한다.
 *
 * 위계는 세 가지로만 만든다.
 *   바탕   진초록 필드(히어로·맺음) ↔ 흰 바탕(본문). 포스터는 전부 창백해서 큰 것이 없었다.
 *   굵기   본문을 400으로 내렸다. 전부 700 이상이면 아무것도 강조되지 않는다.
 *   숫자   시각·소요시간·마감일은 전부 등폭 숫자다. 이 행사의 내용이 곧 숫자다.
 *
 * 웹폰트는 받지 않는다 — 한글 웹폰트 한 벌이 이 페이지 전체보다 무겁고, 대상이
 * 대학생이라 대부분 모바일로 연다. 대신 크기·굵기·자간과 등폭 숫자로 목소리를 나눈다.
 * app.js는 새로 받는다(4KB): 레일이 예약 화면과 똑같은 슬롯 계산을 써야 하는데,
 * 그 규칙을 여기 다시 적으면 언젠가 두 화면이 서로 다른 시간표를 그린다.
 */

:root {
	/* 포스터에서 뽑은 다섯 단계. --pine-900만 새로 넣었다 — 포스터에는 필드로 쓸 만큼
	   깊은 색이 없었고, 그게 없으면 페이지 전체가 창백한 채로 남는다. */
	--pine-900: #0E3A30;
	--pine-700: #1A5A4A;
	--pine-500: #2A7A66;
	--mint-400: #57B79D;
	--mint-100: #D5E9E0;
	--mint-50:  #E9F3EF;

	--paper: #FFFFFF;
	--ink: #16201C;
	--ink-60: #66746E;
	--rule: #DCE6E1;

	/* 이 페이지에서 초록이 아닌 유일한 색. 신청 마감이 임박했을 때만 쓴다 —
	   늘 켜져 있는 경고는 아무것도 경고하지 못한다. */
	--warn: #B4462F;
	--warn-bg: #FDF2EF;

	--sans: -apple-system, BlinkMacSystemFont, Pretendard, "Apple SD Gothic Neo",
		"Malgun Gothic", "Noto Sans KR", sans-serif;
	--mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas,
		"Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }

body {
	margin: 0;
	background: var(--paper);
	color: var(--ink);
	font-family: var(--sans);
	font-size: 16px;
	font-weight: 400;
	line-height: 1.65;
	-webkit-text-size-adjust: 100%;
	/* 한국어는 어절 단위로 끊어야 읽힌다. 320px에서 가로 넘침 없음을 확인했다. */
	word-break: keep-all;
}

:focus-visible { outline: 3px solid var(--mint-400); outline-offset: 3px; border-radius: 2px; }

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}

.shell { max-width: 64rem; margin: 0 auto; padding: 0 1.25rem; }

/* 등폭 숫자 — 시각·기간·마감일에만 붙인다. 이 페이지의 두 번째 목소리다. */
.num {
	font-family: var(--mono);
	font-variant-numeric: tabular-nums;
	font-feature-settings: "tnum" 1;
}

/* 아주 작은 라틴 라벨. 자간을 넓게 벌려 한글 본문과 완전히 다른 소리로 읽히게 한다. */
.eyebrow {
	font-family: var(--mono);
	font-size: .6875rem;
	font-weight: 700;
	letter-spacing: .18em;
	text-transform: uppercase;
}


/* ══ 포스터 ══════════════════════════════════════════════
 *
 * 배포된 인쇄물을 그대로 첫 화면에 세운다. 같은 행사를 알리는 두 매체가 다르게 생기면
 * 학생은 다른 행사로 읽는다.
 *
 * 원본 PNG는 1.6MB다. 대상이 대학생이라 대부분 모바일로 열고, 그 한 장이 페이지 전체보다
 * 무거워진다. webp 111KB / jpeg 161KB로 줄여 두고 브라우저가 고르게 한다.
 */
.poster-band { padding: 1.5rem 0 3rem; }

.poster-top {
	display: flex;
	align-items: center;
	justify-content: flex-end;
	gap: .75rem;
	flex-wrap: wrap;
	margin: 0 0 1rem;
}

/* 남은 날짜 배지는 원래 진초록 필드 위에서 쓰던 색이다. 흰 바탕에서는 민트 글자가
   거의 읽히지 않으므로 여기서만 진한 초록으로 되돌린다. */
.poster-top .dday { color: var(--pine-700); border-color: var(--rule); }
.poster-top .dday[data-urgent] { color: var(--warn); border-color: #E8B4A8; background: var(--warn-bg); }

.poster {
	display: block;
	width: 100%;
	max-width: 44rem;
	margin: 0 auto;
	height: auto;
	border: 1px solid var(--rule);
	border-radius: 2px;
}


/* ══ 본문 ═════════════════════════════════════════════════ */

.band { padding: 4rem 0; }
.band + .band { padding-top: 0; }

/* 참여기업. 포스터의 '이렇게 진행됩니다' 카드와 같은 조형이다 — 연한 민트 바탕에 둥근
   모서리, 아래쪽에 알약 태그. 같은 인쇄물에서 온 화면이라는 것이 그 형태로 읽힌다.
   눌러서 들어가는 카드이므로 바탕과 그림자로 만질 수 있는 것처럼 보이게 한다. */
.firm-grid { display: grid; gap: 1rem; }
@media (min-width: 40rem) { .firm-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 64rem) { .firm-grid { grid-template-columns: repeat(3, 1fr); } }

.firm {
	display: flex;
	flex-direction: column;
	background: var(--mint-50);
	border: 1px solid transparent;
	border-radius: 1rem;
	padding: 1.25rem 1.375rem 1.125rem;
	text-decoration: none;
	color: inherit;
	transition: border-color .12s ease, transform .12s ease, box-shadow .12s ease;
}
.firm:hover, .firm:focus-visible {
	border-color: var(--pine-500);
	transform: translateY(-2px);
	box-shadow: 0 .5rem 1.25rem rgba(14, 58, 48, .10);
}
.firm b { font-size: 1.0625rem; font-weight: 800; letter-spacing: -.02em; }
.firm p { margin: .4375rem 0 0; font-size: .875rem; color: var(--ink-60); }

/* 카드 아래를 가로지르는 줄. 왼쪽은 분류, 오른쪽은 '눌러서 들어간다'는 신호다. */
.firm-foot {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: .75rem;
	margin-top: auto;
	padding-top: 1.125rem;
}
.firm .cat {
	background: var(--mint-100);
	color: var(--pine-700);
	font-size: .75rem;
	font-weight: 800;
	padding: .3125rem .75rem;
	border-radius: 999px;
	white-space: nowrap;
}
.firm .go { font-size: .8125rem; font-weight: 800; color: var(--pine-500); white-space: nowrap; }

/* 기업 정보를 못 받아왔을 때 남는 포스터 문구. */
.firm-fallback { margin: 0; font-weight: 700; letter-spacing: -.015em; }
.firm-fallback .etc { font-weight: 400; color: var(--ink-60); }

/* ── 버튼 ──────────────────────────────────────────────── */

.btn {
	display: inline-flex;
	align-items: center;
	gap: .5rem;
	background: var(--paper);
	color: var(--pine-900);
	border-radius: .625rem;
	padding: .8125rem 1.25rem;
	font-size: .9375rem;
	font-weight: 800;
	letter-spacing: -.01em;
	text-decoration: none;
	transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1.25rem rgba(0, 0, 0, .25); }
.btn:active { transform: translateY(0); }
.btn .arrow { color: var(--pine-500); }

.btn--big { padding: 1.0625rem 1.75rem; font-size: 1.0625rem; }

/* ── 시간표 레일 (이 페이지의 서명) ──────────────────────── */

.rail {
	position: relative;
	margin-top: 3rem;
	background: rgba(255, 255, 255, .055);
	border: 1px solid rgba(213, 233, 224, .18);
	border-radius: 1.125rem;
	padding: 1.375rem 1.25rem 1.125rem;
}

.rail-head {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 1rem;
	flex-wrap: wrap;
	margin-bottom: 1.125rem;
}
.rail-head .eyebrow { color: var(--mint-400); }
.rail-count { font-size: .875rem; color: var(--mint-100); }
.rail-count b {
	font-family: var(--mono);
	font-variant-numeric: tabular-nums;
	font-size: 1.375rem;
	font-weight: 700;
	color: var(--paper);
	margin-right: .125rem;
}

/* 기업 × 시간 격자. 한 줄로 합치면 '한 부스라도 열려 있으면 열림'이 되어, 정원 1인 부스에
   예약이 차도 화면이 꿈쩍하지 않는다. 기업이라는 축을 지우면 안 된다.
   라벨 열 너비를 줄마다 맞춰야 하므로 격자 하나에 이름·트랙을 번갈아 넣는다. */
/* 트랙 열은 1fr이 아니라 minmax(0,1fr)이어야 한다. 그리드 아이템은 min-width가 auto여서
   1fr만 주면 안쪽 flex 트랙이 최소 폭 밑으로 안 줄고 그대로 넘친다. 게다가 .hero가
   overflow:hidden이라 그 넘침이 잘려나가 가로 스크롤 검사에도 안 걸린다. */
.rail-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .5rem .875rem; align-items: center; margin: 0; }

.g-axis, .g-track { display: flex; gap: .25rem; list-style: none; margin: 0; padding: 0; }
.g-axis li, .g-track li { flex: 1 1 0; min-width: 0; text-align: center; }

/* 기업명이 길어도 트랙을 밀어내지 않게 폭을 묶고 줄바꿈을 허용한다.
   '키사이트테크놀로지스코리아' 같은 이름을 말줄임으로 자르면 어느 기업인지 못 읽는다. */
.g-name { font-size: .8125rem; font-weight: 700; letter-spacing: -.01em; max-width: 10rem; line-height: 1.3; }
.g-name b {
	font-family: var(--mono);
	font-weight: 400;
	font-size: .6875rem;
	color: var(--mint-400);
	margin-left: .375rem;
}
.g-name a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(213, 233, 224, .35); }
.g-name a:hover { border-color: var(--mint-400); }

.g-t {
	display: block;
	font-family: var(--mono);
	font-variant-numeric: tabular-nums;
	font-size: .625rem;
	letter-spacing: -.02em;
	color: rgba(213, 233, 224, .78);
}
/* 정시만 남기는 구간. 기준이 34rem이 아니라 46rem인 이유는, 그 사이 폭에서는 기업명 열이
   자리를 먹어 칸이 20px 아래로 내려가기 때문이다 — 라벨(약 24px)이 서로 겹쳐 못 읽는다. */
@media (max-width: 46rem) { .g-axis li:nth-child(even) .g-t { visibility: hidden; } }

/* 칸은 그릇이고, 안의 막대가 남은 자리다. 정원이 5인 부스는 한 명 예약할 때마다 5분의 1씩
   내려간다 — '자리가 있나' 이진값만 그리면 그 부스는 다섯 명이 찰 때까지 꿈쩍하지 않는다. */
.cell {
	display: block;
	position: relative;
	overflow: hidden;
	height: 1.75rem;
	border-radius: 3px;
	transform-origin: bottom;
	/* 필드보다 어둡게 파둔다. 바탕보다 밝게 두면 한 자리 빠진 칸이 가득 찬 칸과 구별되지 않는다. */
	background: rgba(3, 22, 18, .55);
}
.cell b {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: calc(var(--seat, 1) * 100%);
	background: var(--mint-400);
}
.is-full .cell { background: transparent; box-shadow: inset 0 0 0 1px rgba(213, 233, 224, .34); }
.is-past .cell { background: transparent; box-shadow: inset 0 0 0 1px rgba(213, 233, 224, .1); }
/* 그 기업이 그 시간에 아예 열지 않는다. 마감과 같게 그리면 없는 자리를 있다고 말하게 된다. */
.is-off  .cell { background: none; box-shadow: none; }

/* 뼈대(현황 전)는 하루의 모양만 보여주므로 한 줄로 두껍게 둔다.
   채울 막대가 없으니 홈 색을 그대로 두면 바탕에 묻힌다 — 밝은 중립색으로 되돌린다. */
.rail-grid.is-blank .cell { height: 3.25rem; background: rgba(213, 233, 224, .13); }

@media (max-width: 34rem) {
	.rail-grid { grid-template-columns: minmax(0, 1fr); gap: .375rem; }
	.g-corner { display: none; }
	.g-name { max-width: none; margin-top: .5rem; }
	/* 칸이 좁아지므로 높이도 낮춘다 — 안 그러면 시간 막대가 아니라 알약처럼 보인다. */
	.cell { height: 1.375rem; }
}

.rail-foot {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1rem;
	flex-wrap: wrap;
	margin-top: 1.25rem;
}
/* 현황을 못 받으면 칠할 상태가 없으니 범례도 감춘다 — 아무것도 가리키지 않는 범례는 거짓말이다. */
.key { display: flex; align-items: center; gap: 1rem; font-size: .75rem; color: rgba(213, 233, 224, .75); }
.key[hidden] { display: none; }
.key span { display: flex; align-items: center; gap: .375rem; }
.key i { width: .75rem; height: .75rem; border-radius: 2px; background: rgba(3, 22, 18, .55); }
.key .k-open { background: var(--mint-400); }
/* 반만 찬 견본. 막대 높이가 무슨 뜻인지 말로 설명하는 것보다 하나 보여주는 편이 짧다. */
.key .k-half { background: linear-gradient(to top, var(--mint-400) 50%, rgba(3, 22, 18, .55) 50%); }
.key .k-full { background: none; box-shadow: inset 0 0 0 1px rgba(213, 233, 224, .35); }

/* 데이터가 도착할 때 한 번만 도는 연출. 하루가 왼쪽부터 채워지는 모양이다. */
@keyframes rise { from { transform: scaleY(.18); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
/* 열 단위로만 지연을 준다 — 모든 기업의 같은 시간대가 함께 채워지며 왼쪽에서 오른쪽으로 쓸린다. */
.rail-grid.is-live .cell { animation: rise .42s cubic-bezier(.2, .8, .3, 1) backwards; animation-delay: calc(var(--i) * 24ms); }

/* ══ 맺음 ═════════════════════════════════════════════════ */

.closing { background: var(--pine-900); color: var(--paper); padding: 4rem 0 2.5rem; margin-top: 2rem; }
.closing h2 { font-size: clamp(1.75rem, 5.5vw, 2.5rem); font-weight: 900; letter-spacing: -.04em; margin: .75rem 0 .875rem; }
.closing .eyebrow { color: var(--mint-400); }
.closing p { margin: 0 0 2rem; color: var(--mint-100); max-width: 30rem; }

.closing-act { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.mine { color: var(--mint-100); font-size: .875rem; text-decoration: underline; text-underline-offset: 4px; }
.mine:hover { color: var(--paper); }

.colophon {
	margin-top: 3.5rem;
	padding-top: 1.5rem;
	border-top: 1px solid rgba(213, 233, 224, .16);
	font-size: .8125rem;
	color: rgba(213, 233, 224, .7);
}
.colophon p { margin: 0 0 .25rem; color: inherit; }
</style>
</head>
<body>

<header id="sitenav"></header>

<section class="band poster-band">
	<div class="shell">
		<div class="poster-top">
			<span class="dday" id="dday">2026. 8. 25.</span>
		</div>
		<!-- 인쇄물 그대로. 글자가 그림 안에 있으므로 alt에 핵심 사실을 담아
		     화면낭독기와 검색엔진이 읽을 수 있게 한다. 자세한 내용은 행사 개요 페이지에 있다. -->
		<picture>
			<source srcset="poster.webp" type="image/webp">
			<img class="poster" src="poster.jpg" width="1081" height="1455"
			     alt="온라인 채용박람회 포스터. 2026년 8월 25일 화요일 10시부터 17시까지 ZOOM으로 진행합니다. 대학생·졸업생 대상, 참가비 무료. 기업 채용설명회, 1:1 채용 면접·상담, 그룹 상담이 열립니다. 자세한 내용은 행사 개요 페이지를 보세요.">
		</picture>
	</div>
</section>

<main>

	<!-- 포스터가 못 하는 것만 아래에 둔다. 일시·진행 방식·신청 일정은 포스터에 이미 있고
	     행사 개요 페이지가 표로 다시 다루므로, 여기서 또 적으면 같은 말을 세 번 하게 된다. -->
	<section class="band">
		<div class="shell">
			<h2 class="h2" id="firmsTitle">참여기업</h2>
			<div id="firms">
				<p class="firm-fallback">시큐아이 · 쎄트렉아이 · 키사이트테크놀로지스코리아
					<span class="etc">등 국내 우수기업 참여</span></p>
			</div>
		</div>
	</section>

</main>

<footer class="closing">
	<div class="shell">
		<span class="eyebrow">Book</span>
		<h2>예약 시간을 지정해 주세요.</h2>
		<p>1:1 면접·상담과 그룹 상담은 시간대마다 정원이 정해져 있습니다. 원하는 기업과 시간을 먼저 확보하세요.</p>

		<!-- 서명 요소. 하루를 30분으로 자른 칸이 지금 얼마나 남았는지 실제로 물어와 칠한다. -->
		<div class="rail">
			<div class="rail-head">
				<span class="eyebrow">면접 · 상담 시간표</span>
				<!-- 현황을 못 받았을 때 남는 문구. 운영시간만 말한다 — 상담 길이는 아직 미정이다. -->
				<span class="rail-count" id="railCount">10:00 – 17:00</span>
			</div>

			<!-- 칸 하나하나를 읽어주면 수십 번 반복될 뿐이라, 화면낭독기에는 위의 요약만 남긴다. -->
			<div class="rail-grid" id="railGrid" aria-hidden="true"></div>

			<div class="rail-foot">
				<p class="key" id="railKey" hidden>
					<span><i class="k-open"></i> 자리 있음</span>
					<span><i class="k-half"></i> 일부 참</span>
					<span><i class="k-full"></i> 마감</span>
				</p>
				<a class="btn" href="book.html">시간 예약하기 <span class="arrow">→</span></a>
			</div>
		</div>

		<div class="colophon">
			<p>회원가입 없이 이름과 연락처만 입력하면 됩니다.</p>
			<p>주최 · EAST PEACE EDU | ㈜동화인터내셔널 — 참가비는 전액 주최사가 부담합니다.</p>
		</div>
	</div>
</footer>

<script src="app.js"></script>
<script>
/* 남은 날짜를 화면에 박아두지 않고 매번 계산한다. 하루만 지나도 틀린 숫자가
 * 포스터처럼 남아 있는 것이 아무것도 안 쓰는 것보다 나쁘다.
 *
 * 양쪽 다 UTC 자정으로 파싱해서 뺀다. 한쪽이라도 로컬 자정으로 두면
 * KST 자정(=전날 15:00 UTC)에서 날짜가 하루 밀린다 — app.js의 addDays와 같은 이유다.
 * 오늘 날짜도 브라우저 로컬이 아니라 Asia/Seoul로 뽑는다. 해외에서 열어도
 * 행사 기준일은 한국 날짜여야 한다. */
renderNav('home');

const EVENT_DAY = '2026-08-25';
const APPLY_BY = '2026-08-24';

function daysUntil(ymdStr) {
	const today = new Intl.DateTimeFormat('en-CA', {
		timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
	}).format(new Date());
	return Math.round((Date.parse(ymdStr + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 86400000);
}

const toEvent = daysUntil(EVENT_DAY);
const toApply = daysUntil(APPLY_BY);

const ddayEl = document.getElementById('dday');
if (toEvent > 0) {
	ddayEl.textContent = 'D-' + toEvent;
	// 신청 마감이 임박했거나 지났을 때만 색을 쓴다. 늘 빨간 화면은 아무것도 경고하지 못한다.
	if (toApply <= 3) {
		ddayEl.dataset.urgent = '';
		ddayEl.textContent = toApply > 0 ? 'D-' + toEvent + ' · 신청 마감 ' + toApply + '일 전'
			: toApply === 0 ? 'D-' + toEvent + ' · 신청 오늘 마감'
			: 'D-' + toEvent + ' · 신청 마감';
	}
} else if (toEvent === 0) {
	ddayEl.textContent = '오늘 진행';
	ddayEl.dataset.urgent = '';
} else {
	ddayEl.textContent = '행사 종료';
}

/* 참여기업. 등록된 것이 있으면 포스터 문구를 카드 목록으로 바꾼다.
 * 실패하거나 아직 비어 있으면 기본 문구가 그대로 남는다 — 안내가 사라지는 것보다 낫다.
 *
 * 시간표 레일도 같은 목록이 필요하다(회사명을 채용정보로 잇기 위해). 두 번 부르지 않도록
 * 여기서 한 번 받아 이름→id를 남겨두고, 레일은 그것이 준비되기를 기다린다. */
const companyIdByName = new Map();
const companiesReady = (async function () {
	let list;
	try {
		list = await api('api/companies');
	} catch {
		return;
	}
	if (!list || !list.length) {
		return;
	}
	for (const c of list) {
		companyIdByName.set(c.name, c.id);
	}

	const title = document.getElementById('firmsTitle');
	const count = document.createElement('span');
	count.className = 'thin';
	count.textContent = ' ' + list.length + '곳';
	title.append(count);

	const box = document.getElementById('firms');
	box.replaceChildren();
	const grid = document.createElement('div');
	grid.className = 'firm-grid';

	for (const c of list) {
		const card = document.createElement('a');
		card.className = 'firm';
		card.href = 'company.html?id=' + encodeURIComponent(c.id);

		const name = document.createElement('b');
		name.textContent = c.name;
		card.append(name);

		if (c.summary) {
			const p = document.createElement('p');
			p.textContent = c.summary;
			card.append(p);
		}

		const foot = document.createElement('div');
		foot.className = 'firm-foot';
		if (c.category) {
			const cat = document.createElement('span');
			cat.className = 'cat';
			cat.textContent = c.category;
			foot.append(cat);
		} else {
			// 분류가 없어도 오른쪽 신호는 끝에 붙어 있어야 한다.
			foot.append(document.createElement('span'));
		}
		const go = document.createElement('span');
		go.className = 'go';
		go.textContent = '채용정보 →';
		foot.append(go);
		card.append(foot);

		grid.append(card);
	}
	box.append(grid);
})();

/* ── 시간표 레일 ──────────────────────────────────────────
 *
 * 하루의 칸은 부스들의 운영시간을 합쳐서 만들고, 각 칸은 '한 부스라도 자리가 남았는가'로
 * 칠한다. 슬롯 계산은 app.js의 slotGrid를 그대로 쓴다 — 예약 화면과 다른 시간표를
 * 그리기 시작하면 여기 숫자를 아무도 믿을 수 없게 된다.
 *
 * 현황을 못 받아오면 칸만 그리고 숫자는 내보내지 않는다. 틀린 '남은 자리 0'은
 * 아무 숫자도 없는 것보다 나쁘다 — 올 사람을 돌려보낸다. */
(function () {
	const grid = document.getElementById('railGrid');
	const label = document.getElementById('railCount');

	function axisRow(times) {
		const corner = document.createElement('span');
		corner.className = 'g-corner';
		const ol = document.createElement('ol');
		ol.className = 'g-axis';
		for (const t of times) {
			const li = document.createElement('li');
			const s = document.createElement('span');
			s.className = 'g-t';
			s.textContent = hhmm(t);
			li.append(s);
			ol.append(li);
		}
		return [corner, ol];
	}

	/* 뼈대 — 부스를 알기 전의 하루 모양. 기업명 없이 한 줄만 둔다. */
	function blank() {
		const times = slotGrid(EVENT_DAY, '10:00', '17:00', 30).map(d => d.getTime());
		grid.className = 'rail-grid is-blank';
		grid.replaceChildren(...axisRow(times));
		const name = document.createElement('span');
		name.className = 'g-name';
		const ol = document.createElement('ol');
		ol.className = 'g-track';
		for (let i = 0; i < times.length; i++) {
			const li = document.createElement('li');
			const cell = document.createElement('i');
			cell.className = 'cell';
			li.append(cell);
			ol.append(li);
		}
		grid.append(name, ol);
	}

	/* 현황 — 기업마다 한 줄. 한 줄로 합치면 정원 1인 부스가 차도 화면이 안 변한다. */
	function paint(times, rows) {
		const now = Date.now();
		grid.className = 'rail-grid is-live';
		grid.replaceChildren(...axisRow(times));

		for (const row of rows) {
			const name = document.createElement('span');
			name.className = 'g-name';

			// 여기 적힌 회사명이 위 카드에서는 눌리는데 여기서는 안 눌리면 일관성이 깨진다.
			// 기업 목록을 못 받아온 경우에는 그냥 글자로 둔다.
			const companyId = companyIdByName.get(row.booth.companyName);
			if (companyId) {
				const a = document.createElement('a');
				a.href = 'company.html?id=' + encodeURIComponent(companyId);
				a.textContent = row.booth.companyName;
				name.append(a);
			} else {
				name.append(document.createTextNode(row.booth.companyName));
			}

			const no = document.createElement('b');
			no.textContent = row.booth.boothNo;
			name.append(no);

			const ol = document.createElement('ol');
			ol.className = 'g-track';
			times.forEach((t, i) => {
				const li = document.createElement('li');
				const left = row.own.get(t);
				li.className = left === undefined ? 'is-off'
					: t < now ? 'is-past'
					: left > 0 ? 'is-open' : 'is-full';
				li.style.setProperty('--i', i);

				const cell = document.createElement('i');
				cell.className = 'cell';
				if (li.className === 'is-open') {
					// 남은 자리 비율만큼 채운다. 정원 1인 부스는 늘 가득이라 예전과 같아 보인다.
					const fill = document.createElement('b');
					fill.style.setProperty('--seat', left / row.booth.capacity);
					cell.append(fill);
				}

				li.append(cell);
				ol.append(li);
			});
			grid.append(name, ol);
		}
		document.getElementById('railKey').hidden = false;
	}

	blank();

	if (toEvent < 0) {
		label.textContent = '행사가 종료되었습니다';
		return;
	}

	(async function () {
		// 회사명을 채용정보로 이으려면 이름→id가 있어야 한다. 목록을 두 번 부르지 않는다.
		await companiesReady;

		// 이 페이지는 하루짜리 행사를 알린다. 다른 날짜의 부스(지난 행사·시험용)를 같이 그리면
		// 축이 두 날의 합집합이 되고, 라벨은 HH:MM뿐이라 같은 시각이 두 번 나온다.
		//
		// 기업 설명회도 뺀다. 이 표의 이름이 '면접 · 상담 시간표'이고, 설명회는 자기 시간표가
		// 따로 있다 — 섞이면 같은 기업이 두 줄로 나와 어느 쪽이 무엇인지 알 수 없다.
		const booths = (await api('api/booths'))
			.filter(b => b.eventDate === EVENT_DAY && b.kind === 'INTERVIEW');
		if (!booths.length) {
			return;
		}

		// 시간 축은 모든 부스의 합집합이다. 기업마다 운영시간이 달라도 줄이 어긋나지 않는다.
		const axis = new Set();
		const rows = booths.map(b => {
			const own = new Map();
			for (const d of slotGrid(b.eventDate, b.openFrom, b.openTo, b.slotMinutes)) {
				axis.add(d.getTime());
				own.set(d.getTime(), 0); // 응답에 없는 슬롯은 남은 자리 0 — 마감이다.
			}
			return { booth: b, own };
		});

		// 한 부스라도 못 받으면 통째로 뼈대에 머문다. 실패를 '자리 없음'으로 칠하면
		// 멀쩡히 열려 있는 기업을 마감으로 보여주게 된다 — 올 사람을 돌려보낸다.
		const lists = await Promise.all(
			booths.map(b => api('api/booths/' + b.id + '/availability')));
		lists.forEach((list, i) => {
			for (const slot of list) {
				const t = Date.parse(slot.startTime);
				if (rows[i].own.has(t)) {
					rows[i].own.set(t, slot.remaining);
				}
			}
		});

		const times = [...axis].sort((a, b) => a - b);
		paint(times, rows);

		// 칸이 아니라 자리를 센다. 정원이 여럿인 부스는 예약 한 건에 칸이 안 바뀌므로,
		// 칸으로 세면 신청이 들어와도 이 숫자가 그대로다.
		let left = 0;
		let seats = 0;
		for (const row of rows) {
			for (const remaining of row.own.values()) {
				seats += row.booth.capacity;
				left += remaining;
			}
		}
		label.innerHTML = '';
		const n = document.createElement('b');
		n.textContent = left;
		label.append(n, document.createTextNode(' / ' + seats + ' 자리 남음'));
	})().catch(() => {
		/* 현황을 못 받았다. 뼈대는 이미 그려져 있고 라벨은 기본 문구로 둔다. */
	});
})();
</script>
