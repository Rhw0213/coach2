<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>부스 예약 현황</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<p class="mark" id="mark">부스 예약 현황</p>
		<nav>
			<button class="btn btn--ghost" type="button" id="refresh"
			        style="flex:none;padding:.375rem .75rem;font-size:.8125rem">새로고침</button>
		</nav>
	</header>

	<div id="out"><p class="empty">불러오는 중…</p></div>

</div>

<script src="app.js"></script>
<script>
const out = document.getElementById('out');
const mark = document.getElementById('mark');
const token = new URLSearchParams(location.search).get('k');

if (!token) {
	showError(out, '링크가 올바르지 않습니다. 주최측에서 받은 주소로 다시 접속해 주세요.');
} else {
	load();
	// 행사 중에는 예약이 계속 들어온다. 담당자가 새로고침을 누르지 않아도 따라가야 한다.
	setInterval(load, 30_000);
	// 탭을 다시 열었을 때는 30초를 기다리지 않는다.
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible') load();
	});
}

document.getElementById('refresh').addEventListener('click', () => load());

async function load() {
	let data;
	try {
		data = await api('api/staff/' + encodeURIComponent(token));
	} catch (e) {
		showError(out, e.message);
		return;
	}
	render(data);
}

function render(data) {
	mark.textContent = `${data.boothNo} ${data.companyName}`;
	document.title = `${data.boothNo} ${data.companyName} · 예약 현황`;

	// 한 시각에 여러 명이 올 수 있다(그룹면접 정원 5). Map에 한 건씩만 담으면 나중 값이
	// 앞사람을 덮어써서 담당자에게는 5명 중 1명만 보인다 — 현장에서 확인할 방법이 없는 화면이다.
	const byTime = new Map();
	for (const r of data.reservations) {
		const key = new Date(r.startTime).getTime();
		if (!byTime.has(key)) {
			byTime.set(key, []);
		}
		byTime.get(key).push(r);
	}
	const grid = slotGrid(data.eventDate, data.openFrom, data.openTo, data.slotMinutes);
	const now = Date.now();

	out.replaceChildren();

	// ── 지금 담당자에게 가장 중요한 정보: 다음에 누가 오는가 ──
	const upcoming = data.reservations
		.map(r => ({ ...r, ms: new Date(r.startTime).getTime() }))
		.filter(r => r.ms + r.slotMinutes * 60_000 > now)
		.sort((a, b) => a.ms - b.ms);

	// 그룹면접이면 같은 시각에 여러 명이 온다. 다음 칸에 오는 사람을 전부 넘긴다 —
	// 한 명만 보여주면 담당자가 나머지를 모른 채 상담을 시작한다.
	out.append(nextCard(upcoming.filter(r => r.ms === upcoming[0]?.ms), now));

	// ── 요약 ──
	const summary = document.createElement('p');
	summary.className = 'eyebrow';
	summary.style.margin = '2rem 0 .5rem';
	summary.textContent =
		`${dayLabel(data.eventDate)} · ${data.openFrom.slice(0, 5)}–${data.openTo.slice(0, 5)}`
		// 정원이 1이 아니면 '칸 수'가 곧 정원이 아니다. 전체 좌석으로 말해야 담당자가
		// 얼마나 찼는지 안다 — 14칸 × 정원 5면 70석이지 14석이 아니다.
		+ ` · 예약 ${data.reservations.length}건 / 전체 ${grid.length * data.capacity}석`
		+ (data.capacity > 1 ? ` (${grid.length}칸 × 정원 ${data.capacity}명)` : '');
	out.append(summary);

	if (!data.active) {
		const off = document.createElement('p');
		off.className = 'error';
		off.textContent = '이 부스는 현재 신규 예약이 중지된 상태입니다. 기존 예약은 그대로 유효합니다.';
		out.append(off);
	}

	// ── 하루 전체 ──
	const list = document.createElement('ol');
	list.className = 'rail';
	list.setAttribute('role', 'list');
	let lastHour = null;

	for (const start of grid) {
		const here = byTime.get(start.getTime()) ?? [];
		const iso = start.toISOString();
		const li = document.createElement('li');
		li.className = here.length ? 'band' : 'band band--gone';

		const hh = hhmm(iso).slice(0, 2);
		const hour = document.createElement('span');
		hour.className = 'hour';
		hour.textContent = hh === lastHour ? '' : hh;
		lastHour = hh;

		if (here.length) {
			const stack = document.createElement('div');
			for (const r of here) {
				const box = document.createElement('div');
				box.className = 'booked'
					+ (start.getTime() + r.slotMinutes * 60_000 <= now ? ' booked--done' : '');

				// 시각은 그 칸의 첫 사람에게만 찍는다. 같은 시각이 세로로 반복되면
				// 몇 시 칸인지가 아니라 몇 명인지가 안 읽힌다.
				const t = document.createElement('span');
				t.className = 'booked-time';
				t.textContent = r === here[0] ? hhmm(iso) : '';

				const who = document.createElement('span');
				who.className = 'booked-who';
				who.textContent = r.visitorName;

				// 연락처는 tel: 링크로 — 담당자가 현장에서 바로 걸 수 있어야 한다.
				const tel = document.createElement('a');
				tel.className = 'booked-tel';
				tel.href = 'tel:' + r.visitorPhone;
				tel.textContent = r.visitorPhone;

				box.append(t, who);
				const where = affiliation(r);
				if (where) {
					const at = document.createElement('span');
					at.className = 'booked-at';
					at.textContent = where;
					box.append(at);
				}
				box.append(tel);
				stack.append(box);
			}
			li.append(hour, stack);
		} else {
			const gone = document.createElement('span');
			gone.className = 'gone';
			const t = document.createElement('span');
			t.className = 't';
			t.textContent = hhmm(iso);
			const why = document.createElement('span');
			why.textContent = start.getTime() < now ? '' : '비어 있음';
			gone.append(t, why);
			li.append(hour, gone);
		}
		list.append(li);
	}
	out.append(list);

	out.append(roster(data.reservations));
}

/**
 * 예약자 명단. 위 시간표와 같은 사람들이지만 하는 일이 다르다 — 시간표는 '몇 시가 비었나'를
 * 보는 것이고, 이 표는 '누가 오는가'를 빠짐없이 확인하고 그대로 복사해 가는 것이다.
 * 시간표 칸에 신청서 여섯 항목을 다 욱여넣으면 둘 다 못 읽는다.
 */
function roster(reservations) {
	const box = document.createElement('section');

	const title = document.createElement('p');
	title.className = 'eyebrow';
	title.style.margin = '2.5rem 0 .5rem';
	title.textContent = `예약자 명단 · ${reservations.length}명`;
	box.append(title);

	if (!reservations.length) {
		const none = document.createElement('p');
		none.className = 'empty';
		none.textContent = '아직 예약이 없습니다.';
		box.append(none);
		return box;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>시각</th><th>이름</th><th>연락처</th>'
		+ '<th>학교</th><th>전공</th><th>구분</th><th>신청 시각</th></tr></thead>';

	const tbody = document.createElement('tbody');
	// 같은 시각에 여러 명이면 먼저 신청한 사람이 위다 — 담당자가 선착순을 확인하는 순서다.
	const rows = [...reservations].sort((a, b) =>
		new Date(a.startTime) - new Date(b.startTime)
		|| new Date(a.bookedAt) - new Date(b.bookedAt));

	for (const r of rows) {
		const tr = document.createElement('tr');
		tr.append(
			cell(hhmm(r.startTime) + ' · ' + r.slotMinutes + '분', 'num'),
			cell(r.visitorName),
			// tel: 링크로 둔다 — 담당자가 현장에서 바로 걸 수 있어야 한다.
			telCell(r.visitorPhone),
			// 이 기능 이전에 잡힌 예약은 셋이 비어 있다. 빈 칸보다 '-'가 '안 받았다'를 말한다.
			cell(r.visitorSchool || '-'),
			cell(r.visitorMajor || '-'),
			cell(r.visitorStanding || '-'),
			cell(r.bookedAt ? fullWhen(r.bookedAt) : '-', 'num'));
		tbody.append(tr);
	}

	table.append(tbody);

	// 좁은 화면에서 페이지가 통째로 밀리지 않게 표만 자기 상자에서 스크롤시킨다.
	const wrap = document.createElement('div');
	wrap.className = 'admin-wrap';
	wrap.append(table);
	box.append(wrap);
	return box;
}

function cell(text, cls) {
	const td = document.createElement('td');
	if (cls) {
		td.className = cls;
	}
	td.textContent = text;
	return td;
}

function telCell(phone) {
	const td = document.createElement('td');
	td.className = 'num';
	const a = document.createElement('a');
	a.href = 'tel:' + phone;
	a.textContent = phone;
	a.style.color = 'inherit';
	td.append(a);
	return td;
}

/** group: 같은 시각에 오는 사람들. 1:1이면 한 명, 그룹면접이면 정원만큼. */
function nextCard(group, now) {
	const box = document.createElement('div');
	box.className = 'ticket';
	box.style.marginTop = '0';

	const label = document.createElement('p');
	label.className = 'eyebrow';
	label.style.margin = '0 0 .375rem';

	if (!group.length) {
		label.textContent = '다음 상담';
		const none = document.createElement('p');
		none.style.cssText = 'margin:0;font-weight:700;font-size:1.125rem';
		none.textContent = '남은 예약이 없습니다';
		box.append(label, none);
		return box;
	}

	const first = group[0];
	const started = first.ms <= now;
	label.textContent = (started ? '진행 중' : '다음 상담')
		+ (group.length > 1 ? ` · ${group.length}명` : '');

	const when = document.createElement('p');
	when.style.cssText = 'margin:.25rem 0 .75rem;font-family:var(--mono);font-size:.9375rem';
	when.textContent = `${hhmm(first.startTime)} · ${first.slotMinutes}분`
		+ (started ? '' : ` · ${minutesUntil(first.ms, now)}`);

	box.append(label);

	if (group.length === 1) {
		const who = document.createElement('p');
		who.style.cssText = 'margin:0;font-weight:800;font-size:1.5rem;letter-spacing:-.02em';
		who.textContent = first.visitorName;

		// 1:1일 때는 연락처가 유일한 행동이므로 버튼으로 크게 둔다.
		const call = document.createElement('a');
		call.className = 'btn';
		call.style.cssText = 'display:inline-block;text-decoration:none;flex:none;padding:.625rem 1rem';
		call.href = 'tel:' + first.visitorPhone;
		call.textContent = first.visitorPhone;

		const at = document.createElement('p');
		at.style.cssText = 'margin:.25rem 0 0;font-size:.9375rem;color:var(--ink-70)';
		at.textContent = affiliation(first);

		box.append(who, at, when, call);
		return box;
	}

	// 여러 명이면 이름을 하나씩 크게 세우지 않는다 — 명단으로 읽혀야 한다.
	box.append(when);
	for (const p of group) {
		const row = document.createElement('p');
		row.style.cssText = 'display:flex;align-items:baseline;gap:.75rem;margin:0 0 .5rem';
		const who = document.createElement('span');
		who.style.cssText = 'font-weight:800;font-size:1.0625rem;letter-spacing:-.01em';
		who.textContent = p.visitorName;
		const at = document.createElement('span');
		at.style.cssText = 'font-size:.8125rem;color:var(--ink-70)';
		at.textContent = affiliation(p);
		row.append(who, at, tel(p));
		box.append(row);
	}
	return box;
}

/** 학교 · 전공 · 학년. 이 항목 이전에 잡힌 예약은 셋 다 비어 있어 빈 문자열이 나온다. */
function affiliation(r) {
	return [r.visitorSchool, r.visitorMajor, r.visitorStanding].filter(Boolean).join(' · ');
}

function tel(r) {
	const a = document.createElement('a');
	a.className = 'booked-tel';
	a.style.marginLeft = '0';
	a.href = 'tel:' + r.visitorPhone;
	a.textContent = r.visitorPhone;
	return a;
}

function minutesUntil(ms, now) {
	const mins = Math.round((ms - now) / 60_000);
	if (mins < 1) return '곧 시작';
	if (mins < 60) return `${mins}분 뒤`;
	return `${Math.floor(mins / 60)}시간 ${mins % 60}분 뒤`;
}
</script>
</body>
</html>
