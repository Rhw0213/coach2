<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 · 부스 예약</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
/* 체크박스는 app.css의 label 규칙(세로 쌓기)과 맞지 않아 여기서만 눕힌다. */
.check { display: flex; align-items: flex-start; gap: .5rem; }
.check input { width: auto; flex: none; margin-top: .25rem; }
.check span { font-size: .8125rem; color: var(--ink-70); font-weight: 400; }

/* 기업이 하나도 없으면 부스를 만들 수 없다. 그 사실을 폼 위에서 먼저 말해준다. */
.notice {
	background: var(--paper);
	border: 1px solid var(--rail);
	border-left: 3px solid var(--brick);
	border-radius: 2px;
	padding: .75rem 1rem;
	font-size: .875rem;
	margin: 0 0 1rem;
}
.gated-tag { font-size: .75rem; color: var(--pine); }
.warn-tag { font-size: .75rem; color: var(--brick); font-weight: 700; }
.hint { font-size: .8125rem; color: var(--ink-70); margin: -.5rem 0 1rem; }
</style>
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<p class="mark">관리자</p>
		<nav>
			<a href="book.html">예약 화면</a>
			<a href="#" id="signout" hidden>잠그기</a>
		</nav>
	</header>

	<form class="gate" id="gate">
		<p class="eyebrow">인증</p>
		<h1>관리자</h1>
		<label>
			<span>관리자 시크릿</span>
			<input name="secret" type="password" required autocomplete="off">
		</label>
		<div id="gateError"></div>
		<div class="actions">
			<button class="btn" type="submit">열기</button>
		</div>
	</form>

	<main id="panel" hidden>

		<h2 style="margin-top:0">예약 현황</h2>
		<div class="datebar">
			<button class="step" id="prev" type="button" aria-label="이전 날">‹</button>
			<h2 id="dayLabel"></h2>
			<button class="step" id="next" type="button" aria-label="다음 날">›</button>
		</div>
		<div id="bookings"></div>

		<h2>부스</h2>
		<div id="boothError"></div>
		<div id="boothList"></div>

		<!-- 합격자 명단. 부스 목록의 '합격자' 버튼으로 연다. -->
		<section id="approvalPanel" hidden>
			<h2 id="approvalTitle"></h2>
			<p class="lede" id="approvalLede"></p>
			<form id="approvalForm">
				<label>
					<span>명단 붙여넣기 — 한 줄에 이름과 연락처</span>
					<textarea name="text" rows="6" placeholder="홍길동 010-1234-5678&#10;김철수, 010-9876-5432"></textarea>
				</label>
				<div id="approvalError"></div>
				<div class="actions">
					<button class="btn btn--ghost" type="button" id="approvalClose">닫기</button>
					<button class="btn" type="submit" id="approvalSave">명단 추가</button>
				</div>
			</form>
			<div id="approvalResult"></div>
			<div id="approvalList"></div>
		</section>

		<h2 id="formTitle">부스 추가</h2>
		<div id="companyNotice"></div>
		<form id="boothForm">
			<input type="hidden" name="id">
			<!-- 회사명은 직접 적지 않고 고른다. 기업과 부스는 회사명 문자열로 이어져 있어서,
			     한 글자만 달라도 그 기업의 채용정보 페이지에서 이 면접이 사라진다. -->
			<div class="row">
				<label><span>기업</span><select name="companyName" required id="companySelect"></select></label>
				<label><span>부스번호</span><input name="boothNo" required maxlength="20" placeholder="A-12"></label>
			</div>
			<!-- 고른 기업이 이미 무엇을 열어뒀는지. 한 기업이 1:1과 그룹을 각각 열 수 있으므로,
			     지금 무엇이 있는지 보여야 무엇을 더 만들지 판단할 수 있다. -->
			<p class="hint" id="companyHint" hidden></p>
			<label><span>모집 분야 · 한 줄 소개</span><input name="note" maxlength="80" placeholder="선택"></label>
			<div class="row">
				<label><span>행사일</span><input name="eventDate" type="date" required></label>
				<label><span>상담 길이 (분)</span>
					<input name="slotMinutes" type="number" required min="5" max="480" step="5" value="30"></label>
			</div>
			<div class="row">
				<label><span>운영 시작</span><input name="openFrom" type="time" required value="10:00"></label>
				<label><span>운영 종료</span><input name="openTo" type="time" required value="17:00"></label>
			</div>
			<!-- 이 값이 없으면 API가 INTERVIEW로 만든다. 설명회 부스를 화면에서 만들 방법이
			     없어서 시간표에 아무것도 안 뜬 채로 있었다. -->
			<label><span>부스 종류</span>
				<select name="kind" id="kindSelect">
					<option value="INTERVIEW">면접 · 상담 (예약 화면)</option>
					<option value="BRIEFING">기업 설명회 (설명회 시간표 · 인원 제한 없음)</option>
				</select></label>
			<!-- 1이면 1:1 면접·상담, 5면 그룹면접. 한 시간대에 몇 명을 받을지가 곧 좌석 수다.
			     설명회는 인원 제한이 없어 이 값을 쓰지 않으므로 잠근다. -->
			<label id="capacityBox"><span>한 시간대 정원 (명)</span>
				<input name="capacity" type="number" required min="1" max="50" step="1" value="1"></label>
			<p class="hint" id="capacityHint" hidden>기업 설명회는 인원 제한이 없습니다. 정원은 쓰이지 않습니다.</p>
			<!-- 켜면 합격자 명단에 있는 사람만 예약할 수 있다. 끄면 누구나. -->
			<label class="check">
				<input name="approvalRequired" type="checkbox">
				<span>서류 합격자만 예약 (1:1 면접) — 켜면 '신청 링크'를 받고 합격자 명단에 이름·연락처가 있는 사람만 예약됩니다</span>
			</label>
			<div id="formError"></div>
			<div class="actions">
				<button class="btn btn--ghost" type="button" id="resetForm" hidden>새로 추가</button>
				<button class="btn" type="submit" id="save">부스 추가</button>
			</div>
		</form>

		<!-- 기업 · 채용정보. 서버에는 처음부터 API가 있었는데 이 화면이 없어서, 채용관 페이지가
		     회사명만 뜬 채로 남아 있었다. 부스도 기업이 있어야 만들 수 있다. -->
		<h2 id="companyPanel">기업 · 채용정보</h2>
		<p class="lede">여기 적은 내용이 채용관 페이지에 그대로 나갑니다. 비워 둔 항목은 화면에서 통째로 빠집니다 — 빈 제목만 줄줄이 남지 않습니다.</p>
		<div id="companyError"></div>
		<div id="companyList"></div>

		<h3 id="companyFormTitle" style="margin:2rem 0 .75rem">기업 추가</h3>
		<form id="companyForm">
			<input type="hidden" name="id">
			<div class="row">
				<label><span>회사명</span>
					<input name="name" required maxlength="60" placeholder="부스의 기업 선택지에 이 이름이 뜹니다"></label>
				<label><span>기업 구분</span>
					<input name="category" maxlength="20" placeholder="대기업 · 중견기업 · 강소기업"></label>
			</div>
			<label><span>한 줄 소개</span>
				<input name="summary" maxlength="120" placeholder="목록 카드와 메인에 뜨는 한 줄"></label>

			<div class="row">
				<label><span>업종 · 주력사업</span><input name="industry" maxlength="120"></label>
				<label><span>설립</span><input name="founded" maxlength="40"></label>
			</div>
			<div class="row">
				<label><span>매출액</span><input name="revenue" maxlength="40"></label>
				<label><span>임직원 수</span><input name="employees" maxlength="40"></label>
			</div>
			<div class="row">
				<label><span>채용 인원</span><input name="headcount" maxlength="40"></label>
				<!-- type="url"로 두면 브라우저가 'www.secui.com'을 거부해 저장 자체가 막힌다.
				     실제 명단은 스킴 없이 오고, 채용관 화면이 https://를 붙여 링크한다. -->
				<label><span>홈페이지</span>
					<input name="homepage" inputmode="url" maxlength="200" placeholder="www.example.com"></label>
			</div>

			<label><span>기업 소개</span><textarea name="about" rows="4"></textarea></label>
			<label><span>채용 직무</span><textarea name="roles" rows="3"></textarea></label>
			<label><span>주요 업무</span><textarea name="duties" rows="4"></textarea></label>
			<label><span>자격 요건</span><textarea name="requirements" rows="4"></textarea></label>
			<label><span>희망 전공</span><input name="majors" maxlength="200"></label>
			<label><span>채용 개요</span><textarea name="hiring" rows="3"></textarea></label>
			<label><span>복리후생</span><textarea name="benefits" rows="3"></textarea></label>
			<label><span>인재상</span><textarea name="talent" rows="3"></textarea></label>

			<div id="companyFormError"></div>
			<div class="actions">
				<button class="btn btn--ghost" type="button" id="companyReset" hidden>새로 추가</button>
				<button class="btn" type="submit" id="companySave">기업 추가</button>
			</div>
		</form>

	</main>
</div>

<script src="app.js"></script>
<script>
const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const boothForm = document.getElementById('boothForm');
const bookings = document.getElementById('bookings');
const boothList = document.getElementById('boothList');
const boothError = document.getElementById('boothError');
const dayLabelEl = document.getElementById('dayLabel');
const formTitle = document.getElementById('formTitle');
const saveBtn = document.getElementById('save');
const resetBtn = document.getElementById('resetForm');
const signout = document.getElementById('signout');

let viewDate = ymd(0);

/* 시크릿은 sessionStorage에만 둔다 — 탭을 닫으면 사라진다. */
const secretKey = 'coach2.admin';
let secret = sessionStorage.getItem(secretKey) || '';

function adminApi(path, options = {}) {
	return api(path, { ...options, headers: { 'X-Admin-Secret': secret, ...(options.headers || {}) } });
}

boothForm.eventDate.value = ymd(0);
if (secret) open();

gate.addEventListener('submit', async (event) => {
	event.preventDefault();
	secret = gate.secret.value;
	try {
		await adminApi('api/admin/booths');
		sessionStorage.setItem(secretKey, secret);
		open();
	} catch (e) {
		secret = '';
		// 통신 장애를 '시크릿이 틀렸다'고 말하면, 맞는 값을 계속 다시 입력하게 된다.
		showError(document.getElementById('gateError'),
			e.message === '인증에 실패했습니다.' ? '시크릿이 맞지 않습니다.' : e.message);
	}
});

signout.addEventListener('click', (event) => {
	event.preventDefault();
	sessionStorage.removeItem(secretKey);
	location.reload();
});

async function open() {
	gate.hidden = true;
	panel.hidden = false;
	signout.hidden = false;
	// 순서가 중요하다. loadBooths가 viewDate를 행사일로 맞추므로 그 뒤에 조회해야
	// '오늘' 조회와 '행사일' 조회가 경합해 엉뚱한 날의 표가 남는 일이 없다.
	await loadCompanies();
	await loadBooths();
	loadDay();
	loadCompanyPanel();
}

/* 부스는 기업에 속한다. 회사명을 타이핑하게 두면 한 글자 차이로 그 기업의 채용정보
 * 페이지에서 면접이 사라지므로, 등록된 기업 중에서만 고르게 한다. */
let companyNames = [];
/* 기업 전체(채용정보 포함). 아래 기업 패널이 목록과 수정 폼을 여기서 그린다. */
let companiesAll = [];
/* 지금 등록된 부스 전부. 기업을 고를 때 그 기업이 이미 무엇을 열어뒀는지 보여주는 데 쓴다. */
let boothsAll = [];
/* 부스들이 공통으로 쓰는 행사일. 여기서 벗어난 부스는 안내 페이지 시간표에서 빠진다. */
let mainEventDate = '';

document.getElementById('companySelect').addEventListener('change', showCompanyHint);

/** 이 부스가 무엇인지 한 마디로. 설명회에 '정원 1명'이라고 적으면 거짓말이 된다. */
function boothShape(b) {
	return b.kind === 'BRIEFING' ? '설명회'
		: b.capacity > 1 ? `그룹 ${b.capacity}명`
		: '1:1';
}

function showCompanyHint() {
	const hint = document.getElementById('companyHint');
	const name = document.getElementById('companySelect').value;
	const mine = boothsAll.filter(b => b.companyName === name);
	if (!name || !mine.length) {
		hint.hidden = true;
		return;
	}
	hint.hidden = false;
	hint.textContent = `${name}에 이미 있는 것 — `
		+ mine.map(b => `${b.boothNo} ${boothShape(b)}`
			+ (b.approvalRequired ? '(합격자 전용)' : '')).join(', ')
		+ '. 1:1과 그룹은 각각 따로 만듭니다.';
}

async function loadCompanies() {
	const notice = document.getElementById('companyNotice');
	notice.replaceChildren();
	try {
		companiesAll = await adminApi('api/admin/companies');
		companyNames = companiesAll.map(c => c.name);
	} catch (e) {
		showError(notice, e.message);
		return;
	}

	if (!companyNames.length) {
		const p = document.createElement('p');
		p.className = 'notice';
		p.textContent = '등록된 기업이 없습니다. 아래 「기업 · 채용정보」에서 먼저 등록해야 부스를 만들 수 있습니다.';
		notice.append(p);
	}
	fillCompanyOptions();
}

function fillCompanyOptions(extra) {
	const select = document.getElementById('companySelect');
	const chosen = select.value;
	select.replaceChildren();

	// disabled로 두지 않는다. 그러면 폼을 비웠을 때 브라우저가 그 다음 기업을 자동으로 고르고,
	// 아무것도 안 건드린 채 저장하면 엉뚱한 기업에 부스가 생긴다.
	// 값이 빈 채로 남고 select에 required가 걸려 있어 제출은 어차피 막힌다.
	const blank = document.createElement('option');
	blank.value = '';
	blank.textContent = companyNames.length ? '기업을 고르세요' : '등록된 기업 없음';
	select.append(blank);

	// 목록에 없는 이름(기업 개념이 생기기 전에 만든 부스)을 수정할 때, 그 이름을 잠깐 끼워
	// 넣는다. 안 그러면 저장 버튼 한 번에 회사명이 조용히 다른 기업으로 바뀐다.
	for (const name of extra && !companyNames.includes(extra)
			? [extra, ...companyNames] : companyNames) {
		const option = document.createElement('option');
		option.value = name;
		option.textContent = name + (name === extra && !companyNames.includes(extra)
			? ' (등록되지 않은 이름)' : '');
		select.append(option);
	}
	select.value = extra || chosen || '';
}

document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
document.getElementById('next').addEventListener('click', () => shiftDay(1));

function shiftDay(delta) {
	viewDate = addDays(viewDate, delta);
	loadDay();
}

async function loadDay() {
	dayLabelEl.textContent = dayLabel(viewDate) + (viewDate === ymd(0) ? ' · 오늘' : '');
	bookings.innerHTML = '<p class="empty">불러오는 중…</p>';
	try {
		render(await adminApi('api/admin/reservations?date=' + viewDate));
	} catch (e) {
		showError(bookings, e.message);
	}
}

function render(list) {
	if (!list.length) {
		bookings.innerHTML = '<p class="empty">이 날은 예약이 없습니다.</p>';
		return;
	}
	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>시각</th><th>부스</th><th>기업</th><th>예약자</th>'
		+ '<th>소속</th><th>연락처</th></tr></thead>';
	const tbody = document.createElement('tbody');
	for (const r of list) {
		const tr = document.createElement('tr');
		tr.append(
			cell(hhmm(r.startTime) + ' · ' + r.slotMinutes + '분', 'num'),
			cell(r.boothNo, 'num'),
			cell(r.companyName),
			cell(r.visitorName),
			// 학교·전공·학년을 한 칸에 넣는다. 셋으로 나누면 표가 여덟 열이 되어 못 읽는다.
			cell([r.visitorSchool, r.visitorMajor, r.visitorStanding].filter(Boolean).join(' · ')),
			cell(r.visitorPhone, 'num'));
		tbody.append(tr);
	}
	table.append(tbody);
	bookings.replaceChildren(wrapTable(table));
}

/**
 * 눌러서 주소를 복사하는 버튼. 클립보드가 막힌 환경(비HTTPS·구형 브라우저)에서는
 * 입력칸으로 떨어뜨려 직접 고를 수 있게 한다.
 */
function copyButton(td, label, url) {
	const btn = document.createElement('button');
	btn.type = 'button';
	btn.className = 'btn btn--ghost';
	btn.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
	btn.textContent = label;
	btn.addEventListener('click', async () => {
		try {
			await navigator.clipboard.writeText(url);
			btn.textContent = '복사됨';
		} catch {
			const box = document.createElement('div');
			box.className = 'staff-link';
			const input = document.createElement('input');
			input.value = url;
			input.readOnly = true;
			box.append(input);
			td.append(box);
			input.select();
			return;
		}
		setTimeout(() => { btn.textContent = label; }, 1500);
	});
	return btn;
}

/* ── 기업 · 채용정보 ────────────────────────────────────────
 *
 * 부스는 회사명 문자열로 기업과 이어져 있고, 채용관 페이지는 여기 적은 값만 그린다.
 * 서버에는 처음부터 API가 있었는데 이 화면이 없어서 채울 방법이 없었다 —
 * 그래서 채용관이 회사명만 뜬 채로 남아 있었다.
 */
const companyForm = document.getElementById('companyForm');
const companySaveBtn = document.getElementById('companySave');
const companyResetBtn = document.getElementById('companyReset');
const companyFormTitle = document.getElementById('companyFormTitle');

/* 화면은 늘 전체를 보낸다 — 서버가 받은 그대로 덮어쓰므로, 일부만 보내면 나머지가 비워진다.
   Company.updateProfile 주석이 그 계약을 적어두고 있다. */
const COMPANY_FIELDS = ['name', 'category', 'summary', 'industry', 'founded', 'revenue',
	'employees', 'homepage', 'headcount', 'about', 'roles', 'duties', 'requirements',
	'majors', 'hiring', 'benefits', 'talent'];

/* 채용관 페이지에 실제로 그려지는 칸. 몇 칸이 찼는지가 '왜 채용관이 비어 있지'에 답한다. */
const JD_FIELDS = COMPANY_FIELDS.filter(f => f !== 'name' && f !== 'category');

function loadCompanyPanel() {
	const box = document.getElementById('companyList');
	if (!companiesAll.length) {
		box.innerHTML = '<p class="empty">등록된 기업이 없습니다. 아래에서 추가하세요.</p>';
		return;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>기업</th><th>구분</th><th>채용정보</th><th>부스</th>'
		+ '<th>상태</th><th></th></tr></thead>';
	const tbody = document.createElement('tbody');

	for (const c of companiesAll) {
		const filled = JD_FIELDS.filter(f => c[f]).length;
		const tr = document.createElement('tr');

		// 몇 칸이 비었는지 숫자로 말한다. '있음/없음'으로는 무엇을 더 채워야 하는지 모른다.
		const jd = document.createElement('td');
		jd.className = 'num';
		jd.textContent = `${filled} / ${JD_FIELDS.length}`;
		if (!filled) {
			jd.style.color = 'var(--brick)';
		}

		const td = document.createElement('td');
		const edit = document.createElement('button');
		edit.type = 'button';
		edit.className = 'btn btn--ghost';
		edit.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem';
		edit.textContent = '수정';
		edit.addEventListener('click', () => fillCompanyForm(c));

		// 내려도 지우지 않는다. 부스와 예약은 그대로 두고 채용관에서만 빠진다.
		const toggle = document.createElement('button');
		toggle.type = 'button';
		toggle.className = 'btn btn--ghost';
		toggle.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
		toggle.textContent = c.active ? '숨김' : '노출';
		toggle.addEventListener('click', async () => {
			toggle.disabled = true;
			try {
				await adminApi(`api/admin/companies/${c.id}/active?active=${!c.active}`,
					{ method: 'PATCH' });
				await loadCompanies();
				loadCompanyPanel();
			} catch (e) {
				showError(document.getElementById('companyError'), e.message);
			} finally {
				toggle.disabled = false;
			}
		});
		td.append(edit, toggle);

		tr.append(
			cell(c.name),
			cell(c.category || '-'),
			jd,
			cell(String(c.boothCount), 'num'),
			cell(c.active ? '노출중' : '숨김'),
			td);
		tbody.append(tr);
	}

	table.append(tbody);
	box.replaceChildren(wrapTable(table));
}

function fillCompanyForm(c) {
	companyForm.id.value = c.id;
	for (const f of COMPANY_FIELDS) {
		companyForm[f].value = c[f] || '';
	}
	companyFormTitle.textContent = `${c.name} 수정`;
	companySaveBtn.textContent = '변경 저장';
	companyResetBtn.hidden = false;
	companyFormTitle.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

companyResetBtn.addEventListener('click', clearCompanyForm);

function clearCompanyForm() {
	companyForm.reset();
	companyForm.id.value = '';
	companyFormTitle.textContent = '기업 추가';
	companySaveBtn.textContent = '기업 추가';
	companyResetBtn.hidden = true;
}

companyForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	const errorBox = document.getElementById('companyFormError');
	errorBox.replaceChildren();

	const id = companyForm.id.value;
	const body = {};
	for (const f of COMPANY_FIELDS) {
		// 빈 칸은 null로 보낸다. 빈 문자열을 보내면 서버가 trimToNull로 지우기는 하지만,
		// 무엇을 안 적었는지가 요청에서부터 분명한 편이 낫다.
		body[f] = companyForm[f].value.trim() || null;
	}

	companySaveBtn.disabled = true;
	try {
		await adminApi(id ? `api/admin/companies/${id}` : 'api/admin/companies',
			{ method: id ? 'PATCH' : 'POST', body: JSON.stringify(body) });
		clearCompanyForm();
		await loadCompanies();
		loadCompanyPanel();
		// 회사명이 바뀌면 부스 목록의 표시도 따라 바뀐다(서버가 부스의 회사명까지 갱신한다).
		loadBooths();
	} catch (e) {
		showError(errorBox, e.message);
	} finally {
		companySaveBtn.disabled = false;
	}
});

/** 표를 자기 스크롤 상자에 넣는다 — 좁은 화면에서 페이지가 통째로 밀리지 않게. */
function wrapTable(table) {
	const box = document.createElement('div');
	box.className = 'admin-wrap';
	box.append(table);
	return box;
}

function cell(text, cls) {
	const td = document.createElement('td');
	if (cls) td.className = cls;
	td.textContent = text;
	return td;
}

async function loadBooths() {
	boothError.innerHTML = '';
	boothList.innerHTML = '<p class="empty">불러오는 중…</p>';
	let list;
	try {
		list = await adminApi('api/admin/booths');
	} catch (e) {
		boothList.innerHTML = '';
		showError(boothError, e.message);
		return;
	}
	boothsAll = list;
	// 가장 많이 쓰인 행사일을 이 행사의 날로 본다. 여기서 벗어난 부스만 표시하면 되므로
	// 어딘가에 행사일을 따로 적어둘 필요가 없다.
	const dateCount = new Map();
	for (const b of list) {
		dateCount.set(b.eventDate, (dateCount.get(b.eventDate) || 0) + 1);
	}
	mainEventDate = [...dateCount.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || '';
	showCompanyHint();

	// 행사일 기본값을 이 행사의 날로 맞춘다. 오늘로 두면 화면을 열고 처음 추가하는 부스가
	// 조용히 오늘 날짜로 만들어진다. 그 시간이 이미 지나 있으면 시간표에 줄은 뜨는데
	// 신청 버튼만 사라져서, 왜 안 되는지 알아내는 데 한참 걸린다. 실제로 그렇게 걸렸다.
	// 수정 중일 때는 건드리지 않는다 — 고치던 부스의 날짜를 덮어쓰면 안 된다.
	if (mainEventDate && !boothForm.id.value) {
		boothForm.eventDate.value = mainEventDate;
	}

	if (!list.length) {
		boothList.innerHTML = '<p class="empty">등록된 부스가 없습니다. 아래에서 추가하세요.</p>';
		return;
	}

	// 예약 현황은 행사일을 보는 게 기본이다. 오늘이 아니라 첫 부스의 행사일로 맞춘다.
	// 조회는 호출부(open)가 이 함수가 끝난 뒤에 한 번만 한다.
	if (viewDate === ymd(0) && list[0].eventDate !== ymd(0)) {
		viewDate = list[0].eventDate;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>부스</th><th>기업</th><th>행사일</th><th>운영</th><th>상태</th><th></th></tr></thead>';
	const tbody = document.createElement('tbody');

	for (const b of list) {
		const tr = document.createElement('tr');
		const td = document.createElement('td');

		const edit = document.createElement('button');
		edit.type = 'button';
		edit.className = 'btn btn--ghost';
		edit.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-right:.375rem';
		edit.textContent = '수정';
		edit.addEventListener('click', () => fillForm(b));

		const toggle = document.createElement('button');
		toggle.type = 'button';
		toggle.className = 'btn btn--ghost';
		toggle.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem';
		toggle.textContent = b.active ? '중지' : '재개';
		toggle.addEventListener('click', async () => {
			toggle.disabled = true;
			try {
				// 중지해도 이미 잡힌 예약은 유지된다. 새 예약만 막힌다.
				await adminApi(`api/admin/booths/${b.id}/active?active=${!b.active}`, { method: 'PATCH' });
				loadBooths();
			} catch (e) {
				// 표를 지우지 않는다 — 실패한 부스 하나 때문에 나머지 현황을 잃으면 안 된다.
				showError(boothError, e.message);
				toggle.disabled = false;
			}
		});

		// 담당자 링크 — 주최측이 복사해서 각 참가 기업에 전달한다.
		// 이 링크로는 해당 부스 예약만 보이고 아무것도 바꿀 수 없다.
		const link = copyButton(td, '담당자 링크',
			`${location.origin}${BASE}booth.html?k=${b.staffToken}`);

		td.append(edit, toggle, link);

		// 합격자 명단은 합격자 전용 부스에만 뜻이 있다. 아닌 부스에 버튼을 두면
		// 명단을 넣어도 아무 효과가 없다는 것을 나중에야 알게 된다.
		if (b.approvalRequired) {
			// 합격자 전원에게 같이 보내는 링크. 사람마다 다른 주소를 만들어 나눠 보내는 것이
			// 실제로는 굴러가지 않아서, 하나로 보내고 이름·연락처를 명단과 대조한다.
			// 담당자 링크와 절대 섞으면 안 된다 — 그쪽은 예약자 연락처가 다 보인다.
			td.append(copyButton(td, '신청 링크',
				`${location.origin}${BASE}book.html?apply=${b.applyToken}`));

			const who = document.createElement('button');
			who.type = 'button';
			who.className = 'btn btn--ghost';
			who.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
			who.textContent = `합격자 ${b.approvedCount}명`;
			who.addEventListener('click', () => openApprovals(b));
			td.append(who);
		}

		// 삭제는 내린 부스에만 보인다. 서버도 같은 규칙으로 막지만, 누를 수 없어야 실수가 준다.
		if (!b.active) {
			const del = document.createElement('button');
			del.type = 'button';
			del.className = 'btn btn--danger';
			del.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
			del.textContent = '삭제';
			del.addEventListener('click', async () => {
				// 되돌릴 수 없다. 무엇이 함께 사라지는지 말하고 한 번 더 누르게 한다.
				if (del.dataset.sure !== 'yes') {
					del.dataset.sure = 'yes';
					del.textContent = `예약·명단까지 삭제? 한 번 더`;
					setTimeout(() => {
						if (del.dataset.sure === 'yes') {
							del.dataset.sure = '';
							del.textContent = '삭제';
						}
					}, 4000);
					return;
				}
				del.disabled = true;
				try {
					await adminApi(`api/admin/booths/${b.id}`, { method: 'DELETE' });
					loadBooths();
				} catch (e) {
					showError(boothError, e.message);
					del.disabled = false;
					del.dataset.sure = '';
					del.textContent = '삭제';
				}
			});
			td.append(del);
		}

		const state = document.createElement('td');
		state.textContent = b.active ? '운영중' : '중지';
		if (b.approvalRequired) {
			const tag = document.createElement('div');
			// 명단이 비었으면 켜져 있어도 아무도 예약하지 못한다. '0명'만으로는 그 뜻이
			// 읽히지 않아, 그 상태를 그대로 만들어두고 왜 예약이 안 되는지 헤매게 된다.
			tag.className = b.approvedCount ? 'gated-tag' : 'warn-tag';
			tag.textContent = b.approvedCount
				? `합격자 전용 · ${b.approvedCount}명`
				: '합격자 전용 · 명단 없음 — 아무도 예약할 수 없음';
			state.append(tag);
		}
		// 행사일이 저마다 다르면 안내 페이지 시간표에서 일부가 빠진다. 그 페이지는
		// 하루짜리 행사를 그리므로 다른 날의 부스를 걸러낸다.
		if (mainEventDate && b.eventDate !== mainEventDate) {
			const tag = document.createElement('div');
			tag.className = 'warn-tag';
			tag.textContent = `행사일이 다름 (${mainEventDate} 아님)`;
			state.append(tag);
		}

		tr.append(
			cell(b.boothNo, 'num'),
			cell(b.companyName + (b.note ? ' · ' + b.note : '')),
			cell(b.eventDate, 'num'),
			cell(`${b.openFrom.slice(0, 5)}–${b.openTo.slice(0, 5)} · ${b.slotMinutes}분`
				+ (b.kind === 'BRIEFING' ? ' · 설명회'
					: b.capacity > 1 ? ` · 정원 ${b.capacity}명` : ''), 'num'),
			state,
			td);
		tbody.append(tr);
	}
	table.append(tbody);
	boothList.replaceChildren(wrapTable(table));
}

/* ── 합격자 명단 ────────────────────────────────────────────
 *
 * 링크 발송은 시스템이 하지 않는다(메일·문자 수단이 없다). 여기서 만들어진 링크를
 * 명단에 있는 사람만 그 부스를 예약할 수 있다. 링크는 두 가지다 — 부스 목록의
 * '신청 링크' 하나를 전원에게 보내거나(이름·연락처를 명단과 대조한다), 아래 표의
 * 개별 링크를 사람마다 따로 보내거나. 어느 쪽이든 보내는 것이 곧 합격 통보다.
 */
const approvalPanel = document.getElementById('approvalPanel');
const approvalForm = document.getElementById('approvalForm');
let approvalBooth = null;

document.getElementById('approvalClose').addEventListener('click', () => {
	approvalPanel.hidden = true;
	approvalBooth = null;
});

async function openApprovals(b) {
	approvalBooth = b;
	approvalPanel.hidden = false;
	approvalForm.reset();
	document.getElementById('approvalResult').replaceChildren();
	document.getElementById('approvalError').replaceChildren();
	document.getElementById('approvalTitle').textContent = `${b.boothNo} ${b.companyName} · 서류 합격자`;
	document.getElementById('approvalLede').textContent =
		'여기 등록된 사람만 이 1:1 면접을 예약할 수 있습니다. 부스 목록의 「신청 링크」 하나를 전원에게 보내면 됩니다 '
		+ '— 이름과 연락처가 이 명단과 맞아야 신청됩니다. 사람마다 다른 주소로 보내고 싶으면 아래 개별 링크를 쓰세요.';
	approvalPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
	await loadApprovals();
}

async function loadApprovals() {
	const box = document.getElementById('approvalList');
	box.innerHTML = '<p class="empty">불러오는 중…</p>';
	let list;
	try {
		list = await adminApi(`api/admin/booths/${approvalBooth.id}/approvals`);
	} catch (e) {
		box.replaceChildren();
		showError(document.getElementById('approvalError'), e.message);
		return;
	}
	if (!list.length) {
		box.innerHTML = '<p class="empty">아직 등록된 합격자가 없습니다.</p>';
		return;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>이름</th><th>연락처</th><th>개별 링크 (선택)</th><th></th></tr></thead>';
	const tbody = document.createElement('tbody');

	for (const a of list) {
		const url = `${location.origin}${BASE}book.html?k=${a.token}`;
		const tr = document.createElement('tr');

		const linkCell = document.createElement('td');
		const input = document.createElement('input');
		input.value = url;
		input.readOnly = true;
		input.style.cssText = 'width:100%;font-size:.75rem';
		// 클립보드가 막힌 환경에서도 직접 고를 수 있게 입력칸으로 둔다.
		input.addEventListener('focus', () => input.select());
		linkCell.append(input);

		const actions = document.createElement('td');
		const copy = document.createElement('button');
		copy.type = 'button';
		copy.className = 'btn btn--ghost';
		copy.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem';
		copy.textContent = '복사';
		copy.addEventListener('click', async () => {
			try {
				await navigator.clipboard.writeText(url);
				copy.textContent = '복사됨';
				setTimeout(() => { copy.textContent = '복사'; }, 1500);
			} catch {
				input.focus();
			}
		});

		const del = document.createElement('button');
		del.type = 'button';
		del.className = 'btn btn--danger';
		del.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
		del.textContent = '제외';
		del.addEventListener('click', async () => {
			del.disabled = true;
			try {
				// 이미 예약했다면 그 예약은 남는다 — 확정된 약속을 조용히 지우지 않는다.
				await adminApi(`api/admin/approvals/${a.id}`, { method: 'DELETE' });
				await loadApprovals();
				loadBooths();
			} catch (e) {
				showError(document.getElementById('approvalError'), e.message);
				del.disabled = false;
			}
		});

		actions.append(copy, del);
		tr.append(cell(a.name), cell(a.phone, 'num'), linkCell, actions);
		tbody.append(tr);
	}
	table.append(tbody);
	box.replaceChildren(wrapTable(table));
}

approvalForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	const errorBox = document.getElementById('approvalError');
	const resultBox = document.getElementById('approvalResult');
	errorBox.replaceChildren();
	resultBox.replaceChildren();

	const save = document.getElementById('approvalSave');
	save.disabled = true;
	try {
		const r = await adminApi(`api/admin/booths/${approvalBooth.id}/approvals`,
			{ method: 'POST', body: JSON.stringify({ text: approvalForm.text.value }) });

		// 몇 줄이 들어갔는지, 무엇이 걸렀는지 그대로 보여준다. 조용히 삼키면
		// 명단에서 빠진 사람을 행사 당일에야 알게 된다.
		const p = document.createElement('p');
		p.className = 'notice';
		p.textContent = `${r.added}명 추가`
			+ (r.duplicated.length ? ` · 이미 있음 ${r.duplicated.length}줄` : '')
			+ (r.unreadable.length ? ` · 읽지 못함 ${r.unreadable.length}줄` : '');
		resultBox.append(p);

		if (r.unreadable.length) {
			const list = document.createElement('ul');
			list.style.cssText = 'font-size:.8125rem;color:var(--ink-70);margin:.5rem 0 0;padding-left:1.25rem';
			for (const line of r.unreadable) {
				const li = document.createElement('li');
				li.textContent = line;
				list.append(li);
			}
			resultBox.append(list);
		}

		approvalForm.reset();
		await loadApprovals();
		loadBooths();
	} catch (e) {
		showError(errorBox, e.message);
	} finally {
		save.disabled = false;
	}
});

function fillForm(b) {
	boothForm.id.value = b.id;
	fillCompanyOptions(b.companyName);
	boothForm.approvalRequired.checked = !!b.approvalRequired;
	boothForm.boothNo.value = b.boothNo;
	boothForm.note.value = b.note || '';
	boothForm.eventDate.value = b.eventDate;
	boothForm.openFrom.value = b.openFrom.slice(0, 5);
	boothForm.openTo.value = b.openTo.slice(0, 5);
	boothForm.slotMinutes.value = b.slotMinutes;
	boothForm.capacity.value = b.capacity;
	boothForm.kind.value = b.kind || 'INTERVIEW';
	syncKind();
	formTitle.textContent = `${b.boothNo} ${b.companyName} 수정`;
	saveBtn.textContent = '변경 저장';
	resetBtn.hidden = false;
	formTitle.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

resetBtn.addEventListener('click', clearForm);

function clearForm() {
	boothForm.reset();
	boothForm.id.value = '';
	fillCompanyOptions();
	boothForm.eventDate.value = mainEventDate || viewDate;
	syncKind();
	formTitle.textContent = '부스 추가';
	saveBtn.textContent = '부스 추가';
	resetBtn.hidden = true;
}

/* 설명회는 정원을 쓰지 않는다. 칸을 남겨두면 거기 적은 숫자가 지켜질 거라고 읽힌다 —
   합격자 전용도 마찬가지다(설명회는 누구나 듣는다). 둘 다 감춘다. */
function syncKind() {
	const briefing = boothForm.kind.value === 'BRIEFING';
	document.getElementById('capacityBox').hidden = briefing;
	document.getElementById('capacityHint').hidden = !briefing;
	boothForm.capacity.required = !briefing;
	if (briefing) {
		boothForm.capacity.value = 1;
		boothForm.approvalRequired.checked = false;
	}
	boothForm.approvalRequired.closest('label').hidden = briefing;
}

document.getElementById('kindSelect').addEventListener('change', syncKind);
syncKind();

boothForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	const errorBox = document.getElementById('formError');
	errorBox.innerHTML = '';

	const id = boothForm.id.value;
	const body = JSON.stringify({
		companyName: boothForm.companyName.value,
		boothNo: boothForm.boothNo.value,
		note: boothForm.note.value || null,
		eventDate: boothForm.eventDate.value,
		openFrom: boothForm.openFrom.value + ':00',
		openTo: boothForm.openTo.value + ':00',
		slotMinutes: Number(boothForm.slotMinutes.value),
		capacity: Number(boothForm.capacity.value),
		approvalRequired: boothForm.approvalRequired.checked,
		kind: boothForm.kind.value,
	});

	saveBtn.disabled = true;
	try {
		await adminApi(id ? `api/admin/booths/${id}` : 'api/admin/booths',
			{ method: id ? 'PATCH' : 'POST', body });
		clearForm();
		loadBooths();
		loadDay();
	} catch (e) {
		showError(errorBox, e.message);
	} finally {
		saveBtn.disabled = false;
	}
});
</script>
</body>
</html>
