<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 · 부스 예약</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
/* 체크박스는 app.css의 label 규칙(세로 쌓기)과 맞지 않아 여기서만 눕힌다. */
.check { display: flex; align-items: flex-start; gap: .5rem; }
.check input { width: auto; flex: none; margin-top: .25rem; }
.check span { font-size: .8125rem; color: var(--ink-70); font-weight: 400; }

/* 기업이 하나도 없으면 부스를 만들 수 없다. 그 사실을 폼 위에서 먼저 말해준다. */
.notice {
	background: var(--paper);
	border: 1px solid var(--rail);
	border-left: 3px solid var(--brick);
	border-radius: 2px;
	padding: .75rem 1rem;
	font-size: .875rem;
	margin: 0 0 1rem;
}
.gated-tag { font-size: .75rem; color: var(--pine); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">

	<header class="topbar">
		<p class="mark">관리자</p>
		<nav>
			<a href="book.html">예약 화면</a>
			<a href="#" id="signout" hidden>잠그기</a>
		</nav>
	</header>

	<form class="gate" id="gate">
		<p class="eyebrow">인증</p>
		<h1>관리자</h1>
		<label>
			<span>관리자 시크릿</span>
			<input name="secret" type="password" required autocomplete="off">
		</label>
		<div id="gateError"></div>
		<div class="actions">
			<button class="btn" type="submit">열기</button>
		</div>
	</form>

	<main id="panel" hidden>

		<h2 style="margin-top:0">예약 현황</h2>
		<div class="datebar">
			<button class="step" id="prev" type="button" aria-label="이전 날">‹</button>
			<h2 id="dayLabel"></h2>
			<button class="step" id="next" type="button" aria-label="다음 날">›</button>
		</div>
		<div id="bookings"></div>

		<h2>부스</h2>
		<div id="boothError"></div>
		<div id="boothList"></div>

		<!-- 합격자 명단. 부스 목록의 '합격자' 버튼으로 연다. -->
		<section id="approvalPanel" hidden>
			<h2 id="approvalTitle"></h2>
			<p class="lede" id="approvalLede"></p>
			<form id="approvalForm">
				<label>
					<span>명단 붙여넣기 — 한 줄에 이름과 연락처</span>
					<textarea name="text" rows="6" placeholder="홍길동 010-1234-5678&#10;김철수, 010-9876-5432"></textarea>
				</label>
				<div id="approvalError"></div>
				<div class="actions">
					<button class="btn btn--ghost" type="button" id="approvalClose">닫기</button>
					<button class="btn" type="submit" id="approvalSave">명단 추가</button>
				</div>
			</form>
			<div id="approvalResult"></div>
			<div id="approvalList"></div>
		</section>

		<h2 id="formTitle">부스 추가</h2>
		<div id="companyNotice"></div>
		<form id="boothForm">
			<input type="hidden" name="id">
			<!-- 회사명은 직접 적지 않고 고른다. 기업과 부스는 회사명 문자열로 이어져 있어서,
			     한 글자만 달라도 그 기업의 채용정보 페이지에서 이 면접이 사라진다. -->
			<div class="row">
				<label><span>기업</span><select name="companyName" required id="companySelect"></select></label>
				<label><span>부스번호</span><input name="boothNo" required maxlength="20" placeholder="A-12"></label>
			</div>
			<label><span>모집 분야 · 한 줄 소개</span><input name="note" maxlength="80" placeholder="선택"></label>
			<div class="row">
				<label><span>행사일</span><input name="eventDate" type="date" required></label>
				<label><span>상담 길이 (분)</span>
					<input name="slotMinutes" type="number" required min="5" max="480" step="5" value="30"></label>
			</div>
			<div class="row">
				<label><span>운영 시작</span><input name="openFrom" type="time" required value="10:00"></label>
				<label><span>운영 종료</span><input name="openTo" type="time" required value="17:00"></label>
			</div>
			<!-- 1이면 1:1 면접·상담, 5면 그룹면접. 한 시간대에 몇 명을 받을지가 곧 좌석 수다. -->
			<label><span>한 시간대 정원 (명)</span>
				<input name="capacity" type="number" required min="1" max="50" step="1" value="1"></label>
			<!-- 켜면 개별 안내 링크를 받은 서류 합격자만 예약할 수 있다. 끄면 누구나. -->
			<label class="check">
				<input name="approvalRequired" type="checkbox">
				<span>서류 합격자만 예약 (1:1 면접) — 켜면 합격자 명단에 등록된 사람에게 보낸 링크로만 예약됩니다</span>
			</label>
			<div id="formError"></div>
			<div class="actions">
				<button class="btn btn--ghost" type="button" id="resetForm" hidden>새로 추가</button>
				<button class="btn" type="submit" id="save">부스 추가</button>
			</div>
		</form>

	</main>
</div>

<script src="app.js"></script>
<script>
const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const boothForm = document.getElementById('boothForm');
const bookings = document.getElementById('bookings');
const boothList = document.getElementById('boothList');
const boothError = document.getElementById('boothError');
const dayLabelEl = document.getElementById('dayLabel');
const formTitle = document.getElementById('formTitle');
const saveBtn = document.getElementById('save');
const resetBtn = document.getElementById('resetForm');
const signout = document.getElementById('signout');

let viewDate = ymd(0);

/* 시크릿은 sessionStorage에만 둔다 — 탭을 닫으면 사라진다. */
const secretKey = 'coach2.admin';
let secret = sessionStorage.getItem(secretKey) || '';

function adminApi(path, options = {}) {
	return api(path, { ...options, headers: { 'X-Admin-Secret': secret, ...(options.headers || {}) } });
}

boothForm.eventDate.value = ymd(0);
if (secret) open();

gate.addEventListener('submit', async (event) => {
	event.preventDefault();
	secret = gate.secret.value;
	try {
		await adminApi('api/admin/booths');
		sessionStorage.setItem(secretKey, secret);
		open();
	} catch (e) {
		secret = '';
		// 통신 장애를 '시크릿이 틀렸다'고 말하면, 맞는 값을 계속 다시 입력하게 된다.
		showError(document.getElementById('gateError'),
			e.message === '인증에 실패했습니다.' ? '시크릿이 맞지 않습니다.' : e.message);
	}
});

signout.addEventListener('click', (event) => {
	event.preventDefault();
	sessionStorage.removeItem(secretKey);
	location.reload();
});

async function open() {
	gate.hidden = true;
	panel.hidden = false;
	signout.hidden = false;
	// 순서가 중요하다. loadBooths가 viewDate를 행사일로 맞추므로 그 뒤에 조회해야
	// '오늘' 조회와 '행사일' 조회가 경합해 엉뚱한 날의 표가 남는 일이 없다.
	await loadCompanies();
	await loadBooths();
	loadDay();
}

/* 부스는 기업에 속한다. 회사명을 타이핑하게 두면 한 글자 차이로 그 기업의 채용정보
 * 페이지에서 면접이 사라지므로, 등록된 기업 중에서만 고르게 한다. */
let companyNames = [];

async function loadCompanies() {
	const notice = document.getElementById('companyNotice');
	notice.replaceChildren();
	try {
		companyNames = (await adminApi('api/admin/companies')).map(c => c.name);
	} catch (e) {
		showError(notice, e.message);
		return;
	}

	if (!companyNames.length) {
		const p = document.createElement('p');
		p.className = 'notice';
		p.textContent = '등록된 기업이 없습니다. 기업을 먼저 등록해야 부스를 만들 수 있습니다.';
		notice.append(p);
	}
	fillCompanyOptions();
}

function fillCompanyOptions(extra) {
	const select = document.getElementById('companySelect');
	const chosen = select.value;
	select.replaceChildren();

	// disabled로 두지 않는다. 그러면 폼을 비웠을 때 브라우저가 그 다음 기업을 자동으로 고르고,
	// 아무것도 안 건드린 채 저장하면 엉뚱한 기업에 부스가 생긴다.
	// 값이 빈 채로 남고 select에 required가 걸려 있어 제출은 어차피 막힌다.
	const blank = document.createElement('option');
	blank.value = '';
	blank.textContent = companyNames.length ? '기업을 고르세요' : '등록된 기업 없음';
	select.append(blank);

	// 목록에 없는 이름(기업 개념이 생기기 전에 만든 부스)을 수정할 때, 그 이름을 잠깐 끼워
	// 넣는다. 안 그러면 저장 버튼 한 번에 회사명이 조용히 다른 기업으로 바뀐다.
	for (const name of extra && !companyNames.includes(extra)
			? [extra, ...companyNames] : companyNames) {
		const option = document.createElement('option');
		option.value = name;
		option.textContent = name + (name === extra && !companyNames.includes(extra)
			? ' (등록되지 않은 이름)' : '');
		select.append(option);
	}
	select.value = extra || chosen || '';
}

document.getElementById('prev').addEventListener('click', () => shiftDay(-1));
document.getElementById('next').addEventListener('click', () => shiftDay(1));

function shiftDay(delta) {
	viewDate = addDays(viewDate, delta);
	loadDay();
}

async function loadDay() {
	dayLabelEl.textContent = dayLabel(viewDate) + (viewDate === ymd(0) ? ' · 오늘' : '');
	bookings.innerHTML = '<p class="empty">불러오는 중…</p>';
	try {
		render(await adminApi('api/admin/reservations?date=' + viewDate));
	} catch (e) {
		showError(bookings, e.message);
	}
}

function render(list) {
	if (!list.length) {
		bookings.innerHTML = '<p class="empty">이 날은 예약이 없습니다.</p>';
		return;
	}
	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>시각</th><th>부스</th><th>기업</th><th>예약자</th><th>연락처</th></tr></thead>';
	const tbody = document.createElement('tbody');
	for (const r of list) {
		const tr = document.createElement('tr');
		tr.append(
			cell(hhmm(r.startTime) + ' · ' + r.slotMinutes + '분', 'num'),
			cell(r.boothNo, 'num'),
			cell(r.companyName),
			cell(r.visitorName),
			cell(r.visitorPhone, 'num'));
		tbody.append(tr);
	}
	table.append(tbody);
	bookings.replaceChildren(wrapTable(table));
}

/** 표를 자기 스크롤 상자에 넣는다 — 좁은 화면에서 페이지가 통째로 밀리지 않게. */
function wrapTable(table) {
	const box = document.createElement('div');
	box.className = 'admin-wrap';
	box.append(table);
	return box;
}

function cell(text, cls) {
	const td = document.createElement('td');
	if (cls) td.className = cls;
	td.textContent = text;
	return td;
}

async function loadBooths() {
	boothError.innerHTML = '';
	boothList.innerHTML = '<p class="empty">불러오는 중…</p>';
	let list;
	try {
		list = await adminApi('api/admin/booths');
	} catch (e) {
		boothList.innerHTML = '';
		showError(boothError, e.message);
		return;
	}
	if (!list.length) {
		boothList.innerHTML = '<p class="empty">등록된 부스가 없습니다. 아래에서 추가하세요.</p>';
		return;
	}

	// 예약 현황은 행사일을 보는 게 기본이다. 오늘이 아니라 첫 부스의 행사일로 맞춘다.
	// 조회는 호출부(open)가 이 함수가 끝난 뒤에 한 번만 한다.
	if (viewDate === ymd(0) && list[0].eventDate !== ymd(0)) {
		viewDate = list[0].eventDate;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>부스</th><th>기업</th><th>행사일</th><th>운영</th><th>상태</th><th></th></tr></thead>';
	const tbody = document.createElement('tbody');

	for (const b of list) {
		const tr = document.createElement('tr');
		const td = document.createElement('td');

		const edit = document.createElement('button');
		edit.type = 'button';
		edit.className = 'btn btn--ghost';
		edit.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-right:.375rem';
		edit.textContent = '수정';
		edit.addEventListener('click', () => fillForm(b));

		const toggle = document.createElement('button');
		toggle.type = 'button';
		toggle.className = 'btn btn--ghost';
		toggle.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem';
		toggle.textContent = b.active ? '중지' : '재개';
		toggle.addEventListener('click', async () => {
			toggle.disabled = true;
			try {
				// 중지해도 이미 잡힌 예약은 유지된다. 새 예약만 막힌다.
				await adminApi(`api/admin/booths/${b.id}/active?active=${!b.active}`, { method: 'PATCH' });
				loadBooths();
			} catch (e) {
				// 표를 지우지 않는다 — 실패한 부스 하나 때문에 나머지 현황을 잃으면 안 된다.
				showError(boothError, e.message);
				toggle.disabled = false;
			}
		});

		// 담당자 링크 — 주최측이 복사해서 각 참가 기업에 전달한다.
		// 이 링크로는 해당 부스 예약만 보이고 아무것도 바꿀 수 없다.
		const link = document.createElement('button');
		link.type = 'button';
		link.className = 'btn btn--ghost';
		link.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
		link.textContent = '담당자 링크';
		link.addEventListener('click', async () => {
			const url = `${location.origin}${BASE}booth.html?k=${b.staffToken}`;
			try {
				await navigator.clipboard.writeText(url);
				link.textContent = '복사됨';
			} catch {
				// 클립보드가 막힌 환경(비HTTPS·구형 브라우저)에서는 직접 고를 수 있게 보여준다
				const box = document.createElement('div');
				box.className = 'staff-link';
				const input = document.createElement('input');
				input.value = url;
				input.readOnly = true;
				box.append(input);
				td.append(box);
				input.select();
				link.textContent = '담당자 링크';
				return;
			}
			setTimeout(() => { link.textContent = '담당자 링크'; }, 1500);
		});

		td.append(edit, toggle, link);

		// 합격자 명단은 합격자 전용 부스에만 뜻이 있다. 아닌 부스에 버튼을 두면
		// 명단을 넣어도 아무 효과가 없다는 것을 나중에야 알게 된다.
		if (b.approvalRequired) {
			const who = document.createElement('button');
			who.type = 'button';
			who.className = 'btn btn--ghost';
			who.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
			who.textContent = `합격자 ${b.approvedCount}명`;
			who.addEventListener('click', () => openApprovals(b));
			td.append(who);
		}

		// 삭제는 내린 부스에만 보인다. 서버도 같은 규칙으로 막지만, 누를 수 없어야 실수가 준다.
		if (!b.active) {
			const del = document.createElement('button');
			del.type = 'button';
			del.className = 'btn btn--danger';
			del.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
			del.textContent = '삭제';
			del.addEventListener('click', async () => {
				// 되돌릴 수 없다. 무엇이 함께 사라지는지 말하고 한 번 더 누르게 한다.
				if (del.dataset.sure !== 'yes') {
					del.dataset.sure = 'yes';
					del.textContent = `예약·명단까지 삭제? 한 번 더`;
					setTimeout(() => {
						if (del.dataset.sure === 'yes') {
							del.dataset.sure = '';
							del.textContent = '삭제';
						}
					}, 4000);
					return;
				}
				del.disabled = true;
				try {
					await adminApi(`api/admin/booths/${b.id}`, { method: 'DELETE' });
					loadBooths();
				} catch (e) {
					showError(boothError, e.message);
					del.disabled = false;
					del.dataset.sure = '';
					del.textContent = '삭제';
				}
			});
			td.append(del);
		}

		const state = document.createElement('td');
		state.textContent = b.active ? '운영중' : '중지';
		if (b.approvalRequired) {
			const tag = document.createElement('div');
			tag.className = 'gated-tag';
			tag.textContent = `합격자 전용 · ${b.approvedCount}명`;
			state.append(tag);
		}

		tr.append(
			cell(b.boothNo, 'num'),
			cell(b.companyName + (b.note ? ' · ' + b.note : '')),
			cell(b.eventDate, 'num'),
			cell(`${b.openFrom.slice(0, 5)}–${b.openTo.slice(0, 5)} · ${b.slotMinutes}분`
				+ (b.capacity > 1 ? ` · 정원 ${b.capacity}명` : ''), 'num'),
			state,
			td);
		tbody.append(tr);
	}
	table.append(tbody);
	boothList.replaceChildren(wrapTable(table));
}

/* ── 합격자 명단 ────────────────────────────────────────────
 *
 * 링크 발송은 시스템이 하지 않는다(메일·문자 수단이 없다). 여기서 만들어진 링크를
 * 주최측이 복사해 각 합격자에게 보낸다 — 링크를 보내는 것이 곧 합격 통보다.
 */
const approvalPanel = document.getElementById('approvalPanel');
const approvalForm = document.getElementById('approvalForm');
let approvalBooth = null;

document.getElementById('approvalClose').addEventListener('click', () => {
	approvalPanel.hidden = true;
	approvalBooth = null;
});

async function openApprovals(b) {
	approvalBooth = b;
	approvalPanel.hidden = false;
	approvalForm.reset();
	document.getElementById('approvalResult').replaceChildren();
	document.getElementById('approvalError').replaceChildren();
	document.getElementById('approvalTitle').textContent = `${b.boothNo} ${b.companyName} · 서류 합격자`;
	document.getElementById('approvalLede').textContent =
		'여기 등록된 사람만 이 1:1 면접을 예약할 수 있습니다. 각자에게 링크를 복사해 보내주세요 — 링크를 보내는 것이 합격 통보입니다.';
	approvalPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
	await loadApprovals();
}

async function loadApprovals() {
	const box = document.getElementById('approvalList');
	box.innerHTML = '<p class="empty">불러오는 중…</p>';
	let list;
	try {
		list = await adminApi(`api/admin/booths/${approvalBooth.id}/approvals`);
	} catch (e) {
		box.replaceChildren();
		showError(document.getElementById('approvalError'), e.message);
		return;
	}
	if (!list.length) {
		box.innerHTML = '<p class="empty">아직 등록된 합격자가 없습니다.</p>';
		return;
	}

	const table = document.createElement('table');
	table.className = 'admin-table';
	table.innerHTML = '<thead><tr><th>이름</th><th>연락처</th><th>안내 링크</th><th></th></tr></thead>';
	const tbody = document.createElement('tbody');

	for (const a of list) {
		const url = `${location.origin}${BASE}book.html?k=${a.token}`;
		const tr = document.createElement('tr');

		const linkCell = document.createElement('td');
		const input = document.createElement('input');
		input.value = url;
		input.readOnly = true;
		input.style.cssText = 'width:100%;font-size:.75rem';
		// 클립보드가 막힌 환경에서도 직접 고를 수 있게 입력칸으로 둔다.
		input.addEventListener('focus', () => input.select());
		linkCell.append(input);

		const actions = document.createElement('td');
		const copy = document.createElement('button');
		copy.type = 'button';
		copy.className = 'btn btn--ghost';
		copy.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem';
		copy.textContent = '복사';
		copy.addEventListener('click', async () => {
			try {
				await navigator.clipboard.writeText(url);
				copy.textContent = '복사됨';
				setTimeout(() => { copy.textContent = '복사'; }, 1500);
			} catch {
				input.focus();
			}
		});

		const del = document.createElement('button');
		del.type = 'button';
		del.className = 'btn btn--danger';
		del.style.cssText = 'flex:none;padding:.375rem .75rem;font-size:.8125rem;margin-left:.375rem';
		del.textContent = '제외';
		del.addEventListener('click', async () => {
			del.disabled = true;
			try {
				// 이미 예약했다면 그 예약은 남는다 — 확정된 약속을 조용히 지우지 않는다.
				await adminApi(`api/admin/approvals/${a.id}`, { method: 'DELETE' });
				await loadApprovals();
				loadBooths();
			} catch (e) {
				showError(document.getElementById('approvalError'), e.message);
				del.disabled = false;
			}
		});

		actions.append(copy, del);
		tr.append(cell(a.name), cell(a.phone, 'num'), linkCell, actions);
		tbody.append(tr);
	}
	table.append(tbody);
	box.replaceChildren(wrapTable(table));
}

approvalForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	const errorBox = document.getElementById('approvalError');
	const resultBox = document.getElementById('approvalResult');
	errorBox.replaceChildren();
	resultBox.replaceChildren();

	const save = document.getElementById('approvalSave');
	save.disabled = true;
	try {
		const r = await adminApi(`api/admin/booths/${approvalBooth.id}/approvals`,
			{ method: 'POST', body: JSON.stringify({ text: approvalForm.text.value }) });

		// 몇 줄이 들어갔는지, 무엇이 걸렀는지 그대로 보여준다. 조용히 삼키면
		// 명단에서 빠진 사람을 행사 당일에야 알게 된다.
		const p = document.createElement('p');
		p.className = 'notice';
		p.textContent = `${r.added}명 추가`
			+ (r.duplicated.length ? ` · 이미 있음 ${r.duplicated.length}줄` : '')
			+ (r.unreadable.length ? ` · 읽지 못함 ${r.unreadable.length}줄` : '');
		resultBox.append(p);

		if (r.unreadable.length) {
			const list = document.createElement('ul');
			list.style.cssText = 'font-size:.8125rem;color:var(--ink-70);margin:.5rem 0 0;padding-left:1.25rem';
			for (const line of r.unreadable) {
				const li = document.createElement('li');
				li.textContent = line;
				list.append(li);
			}
			resultBox.append(list);
		}

		approvalForm.reset();
		await loadApprovals();
		loadBooths();
	} catch (e) {
		showError(errorBox, e.message);
	} finally {
		save.disabled = false;
	}
});

function fillForm(b) {
	boothForm.id.value = b.id;
	fillCompanyOptions(b.companyName);
	boothForm.approvalRequired.checked = !!b.approvalRequired;
	boothForm.boothNo.value = b.boothNo;
	boothForm.note.value = b.note || '';
	boothForm.eventDate.value = b.eventDate;
	boothForm.openFrom.value = b.openFrom.slice(0, 5);
	boothForm.openTo.value = b.openTo.slice(0, 5);
	boothForm.slotMinutes.value = b.slotMinutes;
	boothForm.capacity.value = b.capacity;
	formTitle.textContent = `${b.boothNo} ${b.companyName} 수정`;
	saveBtn.textContent = '변경 저장';
	resetBtn.hidden = false;
	formTitle.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

resetBtn.addEventListener('click', clearForm);

function clearForm() {
	boothForm.reset();
	boothForm.id.value = '';
	fillCompanyOptions();
	boothForm.eventDate.value = viewDate;
	formTitle.textContent = '부스 추가';
	saveBtn.textContent = '부스 추가';
	resetBtn.hidden = true;
}

boothForm.addEventListener('submit', async (event) => {
	event.preventDefault();
	const errorBox = document.getElementById('formError');
	errorBox.innerHTML = '';

	const id = boothForm.id.value;
	const body = JSON.stringify({
		companyName: boothForm.companyName.value,
		boothNo: boothForm.boothNo.value,
		note: boothForm.note.value || null,
		eventDate: boothForm.eventDate.value,
		openFrom: boothForm.openFrom.value + ':00',
		openTo: boothForm.openTo.value + ':00',
		slotMinutes: Number(boothForm.slotMinutes.value),
		capacity: Number(boothForm.capacity.value),
		approvalRequired: boothForm.approvalRequired.checked,
	});

	saveBtn.disabled = true;
	try {
		await adminApi(id ? `api/admin/booths/${id}` : 'api/admin/booths',
			{ method: id ? 'PATCH' : 'POST', body });
		clearForm();
		loadBooths();
		loadDay();
	} catch (e) {
		showError(errorBox, e.message);
	} finally {
		saveBtn.disabled = false;
	}
});
</script>
</body>
</html>
