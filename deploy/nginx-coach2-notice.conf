# 행사 취소 후 — /etc/nginx/snippets/coach2.conf 를 이 내용으로 덮는다.
#
# 앱과 DB를 내린 뒤에도 포스터·QR·문자로 나간 https://eastpeace.kr/reserve 는 살아 있다.
# 그대로 두면 nginx가 죽은 업스트림에 502를 내고, 들어온 학생은 '서버 고장'으로 읽는다.
# 여기서는 앱 없이 정적 한 장만 내준다 — 컨테이너도 DB도 필요 없다.
#
# 설치:
#   sudo mkdir -p /var/www/coach2-notice/reserve
#   sudo cp /home/ubuntu/coach2/deploy/notice/index.html /var/www/coach2-notice/reserve/
#   sudo cp /home/ubuntu/coach2/deploy/nginx-coach2-notice.conf /etc/nginx/snippets/coach2.conf
#   sudo nginx -t && sudo systemctl reload nginx

location = /reserve {
    return 308 /reserve/$is_args$args;
}

# alias 가 아니라 root 다. root 로 두면 /reserve/무엇이든 이 디렉터리 아래로 떨어지고,
# try_files 가 그 전부를 한 장으로 받아낸다 — 옛 링크는 /reserve/book.html?booth=3 처럼
# 깊은 주소를 갖고 있어서, index 하나만 걸어두면 그쪽은 404가 된다.
location /reserve/ {
    root /var/www/coach2-notice;
    try_files /reserve/index.html =404;
}
