# 분리 후 eastAI 호스트에 남기는 것 — /etc/nginx/snippets/coach2.conf 를 이 내용으로 덮는다.
#
# 왜 남기나: 포스터·QR·문자로 나간 주소가 https://eastpeace.kr/reserve 를 가리킨다.
# 인스턴스를 옮겨도 그 종이와 이미지는 회수되지 않는다. include 한 줄이 redirect 한 줄로
# 바뀔 뿐, eastAI 쪽에 남기는 흔적의 크기는 그대로다.
#
# 308 이지 301 이 아니다. 301 은 브라우저가 관례적으로 POST 를 GET 으로 바꿔 재전송해서
# 신청서 제출이 조용히 사라진다(RFC 7231 6.4.2). 옛 페이지를 열어둔 채 제출한 사람이 여기 걸린다.

location = /reserve {
    return 308 https://reserve.eastpeace.kr/$is_args$args;
}

# 정규식 location 인 이유: return 은 경로 일부를 잘라 쓸 수 없어서 캡처가 필요하다.
# ($request_uri 를 그대로 붙이면 /reserve/reserve/... 가 된다.)
# nginx 는 prefix 보다 정규식을 먼저 고르므로 eastAI 의 location / 보다 이쪽이 이긴다.
location ~ ^/reserve/(.*)$ {
    return 308 https://reserve.eastpeace.kr/$1$is_args$args;
}
