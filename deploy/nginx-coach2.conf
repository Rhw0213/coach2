# coach2 라우팅 — /etc/nginx/snippets/coach2.conf 로 설치한다.
#
# eastAI의 sites-available/eastpeace.kr 안 443 server 블록에 include 한 줄만 추가하면 된다.
# 그 파일에 라우팅 규칙을 직접 써넣지 않는 이유: coach2 설정이 버전관리 밖으로 새지 않게 하고,
# eastAI 파일에 남기는 흔적을 한 줄로 최소화하기 위해서다.
#
# eastAI의 location / 과 충돌하지 않는다. nginx는 prefix location을 선언 순서가 아니라
# 최장 일치로 고르기 때문이다. 같은 server 블록의 location /livekit/ 이 이미 같은 방식으로
# location / 과 공존하고 있다 — 이 호스트에서 이미 검증된 패턴이다.

# 뒤 슬래시 없는 /reserve 요청이 eastAI의 catch-all로 새지 않도록 정규화한다.
# location /reserve/ 는 "/reserve" 를 매치하지 않는다.
#
# 308이지 301이 아니다. 301은 브라우저·curl이 관례적으로 GET으로 바꿔 재전송해서
# POST 본문이 조용히 사라진다(RFC 7231 §6.4.2). 308만 메서드와 본문을 보존한다.
# $is_args$args도 필수 — nginx의 return은 rewrite와 달리 쿼리스트링을 자동으로
# 붙여주지 않아서, 빼먹으면 /reserve?date=... 의 파라미터가 통째로 날아간다.
location = /reserve {
    return 308 /reserve/$is_args$args;
}

location /reserve/ {
    # ⚠ 뒤에 슬래시를 붙이지 말 것.
    # 슬래시를 붙이면 nginx가 /reserve/ 를 떼고 넘기는데, 앱은
    # SERVER_SERVLET_CONTEXT_PATH=/reserve 로 그 prefix가 오기를 기대하므로 전부 404가 된다.
    proxy_pass http://127.0.0.1:8090;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # eastAI 쪽 location / 에는 이 두 줄이 없다. coach2는 처음부터 넣어둔다 —
    # 앱이 클라이언트 IP나 원본 스킴을 봐야 할 때 나중에 소급해서 넣기 어렵다.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
