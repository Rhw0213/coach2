# coach2 전용 호스트용 nginx — eastAI와 인스턴스를 분리한 뒤 쓴다.
# /etc/nginx/sites-available/reserve.eastpeace.kr 로 설치하고 sites-enabled 에 링크한다.
#
# 같은 호스트에 얹혀 있을 때 쓰던 nginx-coach2.conf(스니펫)를 대체한다.
# 그쪽은 eastAI의 server 블록 안에 include 되는 조각이었고, 이쪽은 자기 server 블록이다.
#
# ⚠ 이 파일을 쓸 때 앱의 CONTEXT_PATH 는 빈 값이어야 한다(.env 에서 CONTEXT_PATH= ).
#    prefix 를 떼고 루트로 서비스하므로, /reserve 를 그대로 두면 전부 404 가 된다.

server {
    listen 80;
    listen [::]:80;
    server_name reserve.eastpeace.kr;

    # certbot 의 HTTP-01 검증 경로. 인증서 발급·갱신에 필요하므로 리다이렉트보다 먼저 둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reserve.eastpeace.kr;

    # certbot --nginx 로 발급하면 이 세 줄을 certbot 이 직접 채워 넣는다.
    # 수동으로 둘 때의 경로를 적어둔다 — 발급 전에는 nginx -t 가 실패하므로,
    # 인증서를 먼저 받고(standalone 또는 webroot) 이 server 블록을 켜는 순서로 간다.
    ssl_certificate     /etc/letsencrypt/live/reserve.eastpeace.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reserve.eastpeace.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # ⚠ 뒤에 슬래시를 붙이지 말 것. 붙이면 nginx 가 경로를 다시 쓰는데,
        #    여기서는 요청 URI 를 그대로 넘겨야 한다.
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
