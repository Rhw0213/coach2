name: Deploy coach2 to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 두 번 연속 push하면 같은 디렉터리에서 git pull과 docker compose up이 겹쳐
# .git/index.lock 충돌이나 컨테이너 재생성 경합이 난다. 직렬화한다.
concurrency:
  group: coach2-deploy
  cancel-in-progress: false

jobs:
  # 배포 전에 테스트를 돌린다. bootJar는 test에 의존하지 않으므로
  # Dockerfile 빌드만으로는 테스트가 영원히 실행되지 않는다.
  # 여기서 막지 않으면 깨진 이미지가 운영에 올라간 '뒤에' 배포 후 curl이 알려준다.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.DEPLOY_FREEZE != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: 테스트
        # GitHub 러너에서 돈다 — vCPU 2개짜리 운영 호스트에 빌드 부하를 더하지 않는다.
        # Dockerfile 빌더와 같은 이미지라 Gradle/JDK 버전이 어긋날 일이 없다.
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            gradle:8-jdk17-alpine gradle test --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # eastAI와 같은 호스트를 쓰므로 같은 안전장치를 둔다.
    # 이 변수는 coach2 저장소의 것이며 eastAI의 것과 별개다.
    # ⚠ 정확히 소문자 'true' 여야 동작한다. 'True'/'TRUE'는 걸리지 않는다.
    if: vars.DEPLOY_FREEZE != 'true'

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠ 반드시 .env 전송 '전에' 돈다.
      # EC2_APP_DIR가 실수로 /home/ubuntu/eastAI로 설정돼 있으면 다음 단계의 scp가
      # eastAI의 .env를 coach2 값으로 덮어쓰고, 이어지는 compose up이 eastAI 컨테이너를
      # 재기동시킨다. 시크릿 오타 하나로 coach1을 건드리게 되는 유일한 경로다.
      - name: 배포 대상이 coach2인지 확인
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "grep -q '^name: coach2' '${{ secrets.EC2_APP_DIR }}/docker-compose.yml' \
             || { echo '❌ EC2_APP_DIR가 coach2 체크아웃이 아님 — 중단'; exit 1; }"

      - name: .env 생성 후 전송
        run: |
          cat > /tmp/deploy.env << 'ENVEOF'
          DB_USERNAME=coach2
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
          CONTEXT_PATH=/reserve
          ENVEOF
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            /tmp/deploy.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/.env"
          # scp는 -p 없이는 원본 권한을 보존하지 않아 umask대로 644가 된다.
          # 평문 DB 비밀번호가 호스트의 다른 계정에 읽힌다.
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "chmod 600 '${{ secrets.EC2_APP_DIR }}/.env'"

      - name: git pull → docker compose up
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -e
             cd '${{ secrets.EC2_APP_DIR }}'
             echo '▶ git pull'
             git pull origin main
             echo '▶ docker compose up --build'
             docker compose up --build -d --wait --wait-timeout 180
             echo '▶ coach2 이미지 정리'
             docker image prune -f
             echo '✅ 배포 완료'"
          # docker builder prune은 넣지 않는다. 빌드 캐시는 데몬 전역이라
          # coach2 배포가 eastAI의 캐시까지 지워 다음 eastAI 배포를 느리게 만든다.
          # 캐시 정리는 사람이 직접, 따로 한다.

      - name: 헬스체크
        # deploy가 실패했을 때야말로 eastAI 상태를 알아야 하므로 항상 돈다.
        if: always()
        run: |
          # 인스턴스를 분리하면 주소가 바뀐다. 변수 하나로 갈아끼운다 —
          # 안 넣으면 지금까지의 주소를 그대로 본다.
          COACH2_URL="${{ vars.PUBLIC_URL || 'https://eastpeace.kr/reserve' }}"
          coach2_ok=false
          for i in $(seq 1 30); do
            body=$(curl -fsS --connect-timeout 5 --max-time 15 \
                   "$COACH2_URL/health" 2>/dev/null) || body=""
            # 상태코드만 보면 안 된다. nginx include가 아직 없으면 /reserve/health가
            # eastAI의 catch-all로 새는데, eastAI가 2xx를 주면 통과해버린다.
            if echo "$body" | grep -q '"app":"coach2"'; then
              coach2_ok=true
              break
            fi
            sleep 6
          done
          $coach2_ok && echo "✅ coach2 응답 정상" || echo "❌ coach2가 응답하지 않음"

          # coach2 실패 시 여기서 exit하면 안 된다 — 이 검사가 더 중요하다.
          # ⚠ 인스턴스를 분리해 컷오버가 끝나면 아래 eastAI 검사를 지운다. 같은 호스트가
          #    아니게 되므로, 남의 서비스 장애로 coach2 배포가 실패하게 된다.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 \
                 "https://eastpeace.kr/" || echo 000)
          # eastAI 루트는 평소에 302를 준다(앱이 리다이렉트). 200을 요구하면 멀쩡한데도
          # 배포가 실패한다. 여기서 잡아야 하는 건 'nginx가 앱에 닿지 못하는 상태' —
          # 즉 5xx와 연결실패(000)다. 2xx/3xx/4xx는 경로가 살아 있다는 뜻이다.
          case "$code" in
            000|5*) east_ok=false ;;
            *)      east_ok=true ;;
          esac
          $east_ok && echo "✅ eastAI 정상 ($code)" || echo "❌ eastAI 응답 이상: $code — 즉시 확인 필요"

          $east_ok || exit 1
          $coach2_ok || exit 1

  freeze-notice:
    if: vars.DEPLOY_FREEZE == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "::warning::DEPLOY_FREEZE=true — 배포를 건너뜁니다. 해제: Settings > Variables > DEPLOY_FREEZE"'
